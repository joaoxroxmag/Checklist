<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CheckList ✅</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<style>
  :root {
    --bg: #f4f6fb;
    --card: rgba(255,255,255,.90);
    --card-solid: #ffffff;
    --ink: #161b2b;
    --muted: #6d7485;
    --line: rgba(37,45,66,.13);
    --accent: #5b5ce2;
    --accent-soft: rgba(91,92,226,.11);
    --danger: #dc3f4b;
    --shadow: 0 18px 48px rgba(30,37,64,.12);
    --day-green: rgba(32,164,100,.13);
    --day-yellow: rgba(215,147,18,.15);
    --day-red: rgba(220,63,75,.11);
    --category: rgba(91,92,226,.095);
    --footer: rgba(91,92,226,.06);
  }

  body[data-theme="dark"] {
    --bg: #0b1020;
    --card: rgba(17,24,39,.91);
    --card-solid: #121a2b;
    --ink: #edf0f8;
    --muted: #98a2b7;
    --line: rgba(221,228,244,.13);
    --accent: #8c8df4;
    --accent-soft: rgba(140,141,244,.14);
    --danger: #ff737d;
    --shadow: 0 18px 52px rgba(0,0,0,.40);
    --day-green: rgba(53,197,118,.15);
    --day-yellow: rgba(236,177,55,.16);
    --day-red: rgba(239,91,102,.14);
    --category: rgba(140,141,244,.13);
    --footer: rgba(140,141,244,.08);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    margin: 0;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 22px;
    transition: color .2s ease, background .2s ease;
  }

  .landscape-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
  }
  .landscape-bg svg { width: 100%; height: 100%; display: block; }
  .page-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(244,246,251,.42), rgba(240,241,249,.72));
    backdrop-filter: blur(1px);
  }
  body[data-theme="dark"] .page-overlay {
    background: linear-gradient(180deg, rgba(7,10,24,.58), rgba(9,12,28,.78));
  }

  .wrap { max-width: 1280px; margin: 0 auto; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(13px);
  }
  .brand h1 { margin: 0; font-size: clamp(23px, 3vw, 34px); line-height: 1; }
  .brand p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
  .main-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card-solid);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  body[data-theme="dark"] button.primary { color: #fff; }
  button.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(190,60,60,.09); }

  #weeksContainer { display: grid; gap: 18px; }
  .week-card {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(13px);
    overflow: hidden;
  }
  .week-head {
    padding: 13px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .week-title-wrap { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .week-title { font-size: 17px; font-weight: 800; }
  .week-range { color: var(--muted); font-size: 12px; }
  .week-actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .week-actions button { padding: 6px 9px; font-size: 12px; }

  .week-scroll { overflow-x: auto; padding: 13px; }
  .table-shell { min-width: 890px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  col.meta-col { width: 300px; }
  col.day-col { width: calc((100% - 300px) / 7); }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; padding: 0; }
  tr > :first-child { border-left: 1px solid var(--line); }
  thead tr:first-child > * { border-top: 1px solid var(--line); }
  thead tr:first-child > :first-child { border-top-left-radius: 12px; }
  thead tr:first-child > :last-child { border-top-right-radius: 12px; }
  tfoot tr:last-child > :first-child { border-bottom-left-radius: 12px; }
  tfoot tr:last-child > :last-child { border-bottom-right-radius: 12px; }

  th {
    background: rgba(255,255,255,.50);
    color: var(--muted);
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 700;
  }
  body[data-theme="dark"] th { background: rgba(10,18,22,.38); }
  .meta-head {
    font-size: 25px;
    color: var(--ink);
    text-align: center;
    font-weight: 900;
    letter-spacing: .2px;
  }
  .day-header { min-height: 63px; display: grid; align-content: center; gap: 4px; }
  .day-name { font-size: 12px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: .5px; }
  .date-input {
    width: 82px;
    max-width: calc(100% - 8px);
    margin: 0 auto;
    padding: 3px 4px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    text-align: center;
    font: inherit;
    font-size: 11px;
  }
  .date-input:hover, .date-input:focus { outline: none; border-color: var(--accent); background: var(--card-solid); color: var(--ink); }

  .task-row.dragging, .category-row.dragging { opacity: .42; }
  .task-row.drag-over > *, .category-row.drag-over > * { box-shadow: inset 0 3px 0 var(--accent); }
  .meta-cell { min-height: 64px; display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: rgba(255,255,255,.35); }
  body[data-theme="dark"] .meta-cell { background: rgba(6,12,15,.18); }
  .task-main { min-width: 0; flex: 1; padding: 1px 3px; }
  .task-title { font-size: 13px; font-weight: 850; line-height: 1.3; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .drag-handle { cursor: grab; user-select: none; color: var(--muted); width: 26px; height: 32px; display: grid; place-items: center; flex: 0 0 26px; border-radius: 8px; font-size: 16px; transition: background .15s ease, color .15s ease; }
  .drag-handle:hover { background: var(--accent-soft); color: var(--accent); }
  .drag-handle:active { cursor: grabbing; }
  .row-input, .category-input {
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
  }
  .row-input:focus, .category-input:focus { outline: none; border-color: var(--accent); background: var(--card-solid); }
  .row-tools { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .row-tools button { border: none; background: transparent; width: 29px; height: 29px; padding: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; border-radius: 8px; }
  .row-tools button:hover { color: var(--ink); background: var(--accent-soft); }
  .row-tools .remove-row:hover { color: var(--danger); background: rgba(190,60,60,.10); }
  .task-badges { margin-top: 5px; gap: 5px !important; }
  .tiny-badge { padding: 3px 7px !important; border-radius: 999px !important; }

  .category-row td.category-full-cell { padding: 0; background: var(--category); border-right: 1px solid var(--line); }
  .category-full { min-height: 48px; display: grid; grid-template-columns: 42px minmax(0,1fr) 42px; align-items: center; padding: 4px 9px; }
  .category-full .drag-handle { justify-self: start; }
  .category-input { justify-self: center; width: min(420px, 72%); text-align: center; font-size: 14px; font-weight: 900; letter-spacing: .45px; text-transform: uppercase; color: var(--ink) !important; -webkit-text-fill-color:var(--ink); }
  .category-delete { justify-self: end; width: 30px; height: 30px; min-height: 30px; padding: 0; border: none; display: grid; place-items: center; border-radius: 8px; background: transparent; color: var(--muted); }
  .category-delete:hover { color: var(--danger); border-color: transparent; background: rgba(190,60,60,.10); }
  .category-fill { display: none; }

  .check-cell { height: 50px; }
  .cell-btn { width: 100%; height: 50px; border: none; border-radius: 0; background: transparent; display: grid; place-items: center; padding: 0; }
  .cell-btn:hover { background: rgba(255,255,255,.20); border-color: transparent; }
  .box { width: 27px; height: 27px; border: 2px solid var(--line); border-radius: 7px; display: grid; place-items: center; color: #fff; font-weight: 900; }
  .cell-btn.filled .box { background: var(--accent); border-color: var(--accent); }
  body[data-theme="dark"] .cell-btn.filled .box { color: #10251c; }
  .cell-btn.missed .box { background: #d84f4f; border-color: #a92f2f; color: #fff; }
  .cell-btn.missed:hover .box { background: #c83e3e; border-color: #8f2424; }

  .day-none { background: transparent; }
  .day-green { background: var(--day-green) !important; }
  .day-yellow { background: var(--day-yellow) !important; }
  .day-red { background: var(--day-red) !important; }

  tfoot td { background: var(--footer); padding: 9px 5px; font-size: 12px; font-weight: 900; }
  .daily-label { text-align: center; font-size: 13px; }


  .status { margin: 12px 4px 0; color: var(--muted); font-size: 12px; min-height: 18px; }

  .analysis-panel {
    margin-top: 18px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(13px);
    overflow: hidden;
  }
  .analysis-panel[hidden] { display: none; }
  .analysis-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .analysis-head h2 { margin: 0; font-size: 22px; }
  .analysis-content { padding: 16px; display: grid; gap: 18px; }
  .analysis-section { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.32); padding: 14px; overflow-x: auto; }
  body[data-theme="dark"] .analysis-section { background: rgba(5,11,14,.17); }
  .analysis-section h3 { margin: 0 0 5px; }
  .analysis-section .summary { color: var(--muted); margin-bottom: 11px; font-size: 13px; }
  .analysis-table { min-width: 520px; border-collapse: collapse; }
  .analysis-table th, .analysis-table td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
  .analysis-table th { font-size: 12px; }
  .analysis-table td:last-child, .analysis-table th:last-child { text-align: right; }
  .monthly-summary strong { font-size: 25px; line-height: 1; color: var(--accent); vertical-align: -2px; }

  .graph-panel { overflow: hidden; }
  .graph-toolbar { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 12px 0 14px; }
  .graph-modes { display: flex; gap: 7px; flex-wrap: wrap; }
  .graph-mode-btn { font-size: 12px; padding: 7px 10px; }
  .graph-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  body[data-theme="dark"] .graph-mode-btn.active { color: #10251c; }
  .graph-scope-wrap { display: grid; gap: 4px; min-width: min(310px, 100%); }
  .graph-scope-wrap label { color: var(--muted); font-size: 11px; font-weight: 800; }
  .graph-select { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--card-solid); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 13px; }
  .graph-box { border: 1px solid var(--line); border-radius: 12px; background: var(--card-solid); padding: 10px; min-width: 680px; }
  .line-chart { display: block; width: 100%; height: auto; min-height: 320px; }
  .chart-grid { stroke: var(--line); stroke-width: 1; }
  .chart-axis { stroke: var(--muted); stroke-width: 1.2; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .chart-point { fill: var(--card-solid); stroke: var(--accent); stroke-width: 3; }
  .chart-label, .chart-y-label { fill: var(--muted); font-size: 12px; }
  .chart-value { fill: var(--ink); font-size: 12px; font-weight: 900; }
  .chart-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }

  .month-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .month-card { border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: var(--card-solid); }
  .month-card h4 { margin: 0 0 4px; text-transform: capitalize; }
  .month-total { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar .dow { font-size: 10px; color: var(--muted); text-align: center; font-weight: 800; padding: 3px 0; }
  .calendar-day { min-height: 47px; border: 1px solid var(--line); border-radius: 7px; padding: 5px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; }
  .calendar-day.empty { visibility: hidden; }
  .calendar-day strong { font-size: 12px; }
  .calendar-day small { color: var(--muted); font-size: 9px; }
  .legend { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 9px; color: var(--muted); font-size: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }

  .empty-state { padding: 34px 18px; text-align: center; color: var(--muted); }

  @media (max-width: 720px) {
    body { padding: 10px; }
    .topbar { align-items: flex-start; padding: 14px; }
    .main-actions { justify-content: flex-start; }
    .brand { width: 100%; }
    .week-head { align-items: flex-start; }
  }

  @media print {
    .landscape-bg, .page-overlay, .topbar, #weeksContainer, .status, .analysis-head button { display: none !important; }
    body { background: #fff; color: #000; padding: 0; }
    .analysis-panel { display: block !important; box-shadow: none; border: none; margin: 0; }
    .analysis-section, .month-card { break-inside: avoid; background: #fff; }
  }
  .hidden { display: none !important; }
  .toolbar-group { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .search-input, .select-input, .number-input, .text-input, textarea {
    border:1px solid var(--line); background:var(--card-solid); color:var(--ink);
    border-radius:9px; padding:8px 10px; font:inherit;
  }
  .search-input { min-width:210px; }
  .today-panel, .period-card {
    border:1px solid var(--line); background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); backdrop-filter:blur(13px); margin-bottom:18px; overflow:hidden;
  }
  .today-panel { position: relative; background: radial-gradient(circle at 96% -20%, rgba(91,92,226,.16), transparent 28rem), var(--card); }
  body[data-theme="dark"] .today-panel { background: radial-gradient(circle at 96% -20%, rgba(140,141,244,.15), transparent 28rem), var(--card); }
  .today-panel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent); }
  .today-head, .period-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:16px 18px; border-bottom:1px solid var(--line); }
  .today-head b { font-size:32px !important; letter-spacing:-.04em; }
  .today-body { padding:17px 18px 19px; display:grid; gap:16px; }
  .today-stats { display:flex; gap:8px; flex-wrap:wrap; }
  .metric-chip { padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card-solid); font-size:11px; font-weight:800; }
  .today-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
  .today-task { min-height:66px; display:grid; grid-template-columns:minmax(170px,1fr) auto; gap:12px; align-items:center; border:1px solid var(--line); border-radius:15px; padding:11px 12px 11px 15px; background:var(--card-solid); transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease; }
  .today-task:hover { transform:translateY(-1px); border-color:rgba(91,92,226,.35); box-shadow:0 8px 20px rgba(30,37,64,.08); }
  .today-task-title { font-size:13px; font-weight:900; line-height:1.3; }
  .today-task-meta { color:var(--muted); font-size:10px; line-height:1.4; margin-top:4px; }
  .today-state-btn { width:46px; height:46px; flex:0 0 46px; padding:0; display:grid; place-items:center; border:2px solid var(--line); border-radius:11px; background:transparent; color:var(--muted); font-size:18px; font-weight:900; line-height:1; }
  .today-state-btn:hover { border-color:var(--accent); background:var(--accent-soft); }
  .today-state-btn.filled { background:var(--accent); border-color:var(--accent); color:#fff; }
  body[data-theme="dark"] .today-state-btn.filled { color:#fff; }
  .today-state-btn.missed { background:#d84f4f; border-color:#a92f2f; color:#fff; }
  .today-state-btn.missed:hover { background:#c83e3e; border-color:#8f2424; }
  .today-state-btn.excused { background:#7b55c7; border-color:#5d36a7; color:#fff; }
  .today-state-btn.excused:hover { background:#6d47bb; border-color:#5d36a7; }
  .today-note { width:100%; min-height:96px; resize:vertical; line-height:1.5; }
  .paused-cell { color:var(--muted); font-weight:900; font-size:18px; }
  .cell-btn.excused .box { background:#7b55c7; border-color:#5d36a7; color:#fff; }
  .cell-btn.excused:hover .box { background:#6d47bb; }
  .cell-stack { display:grid; place-items:center; gap:2px; }
  .sub-progress { font-size:9px; color:var(--muted); line-height:1; }
  .task-badges { display:flex; gap:4px; flex-wrap:wrap; }
  .tiny-badge { font-size:9px; border:1px solid var(--line); border-radius:999px; padding:2px 5px; color:var(--muted); background:var(--card-solid); }
  .week-card.collapsed .week-scroll { padding:10px 13px 13px; }
  .collapsed-table .status-square { width:25px; height:25px; border-radius:7px; display:grid; place-items:center; margin:auto; color:white; font-weight:900; }
  .status-good { background:#36a861; }
  .status-bad { background:#d84f4f; }
  .status-neutral { background:#7b55c7; }
  .status-none { background:#879198; }
  .auto-green { background:var(--day-green)!important; }
  .auto-red { background:var(--day-red)!important; }
  .auto-purple { background:rgba(123,85,199,.18)!important; }
  .periods-wrap { display:grid; gap:12px; margin-bottom:18px; }
  .period-body { padding:12px; overflow-x:auto; }
  .period-mini-table { min-width:720px; }
  .period-mini-table th, .period-mini-table td { padding:8px 6px; }
  .analysis-selector-row { display:flex; gap:9px; flex-wrap:wrap; align-items:end; margin:9px 0 13px; }
  .analysis-selector-row label { display:grid; gap:4px; color:var(--muted); font-size:11px; font-weight:800; }
  .analysis-subtitle { color:var(--muted); font-size:12px; margin:4px 0 9px; }
  .analysis-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:9px; margin:10px 0 12px; }
  .analysis-card { border:1px solid var(--line); border-radius:11px; padding:10px; background:var(--card-solid); }
  .analysis-card b { display:block; font-size:20px; margin-top:4px; }
  .analysis-table .category-analysis-row td { background:var(--category); font-weight:900; }
  .percent-over { color:#198754; font-weight:900; }
  .trend-list { display:grid; gap:6px; margin-top:8px; }
  .trend-row { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid var(--line); padding-top:6px; font-size:12px; }
  .trend-positive { color:#198754; font-weight:900; }
  .trend-negative { color:var(--danger); font-weight:900; }
  .trend-neutral { color:var(--muted); font-weight:800; }
  .comparison-note { color:var(--muted); font-size:11px; margin-top:7px; }
  .calendar-symbols { font-size:12px; font-weight:900; min-height:17px; }
  .calendar-day.current-record { outline:2px solid var(--accent); }
  .modal-backdrop, .pin-gate {
    position:fixed; inset:0; z-index:1000; background:rgba(5,12,16,.72); display:grid; place-items:center; padding:18px;
  }
  .modal { width:min(720px,100%); max-height:90vh; overflow:auto; background:var(--card-solid); color:var(--ink); border:1px solid var(--line); border-radius:18px; box-shadow:0 24px 80px rgba(0,0,0,.45); }
  .modal.small { width:min(430px,100%); }
  .modal-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .modal-head h2 { margin:0; font-size:20px; }
  .modal-body { padding:16px; display:grid; gap:13px; }

  const WEEKDAY_NAMES = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const MONTH_NAMES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const STATUS_ORDER = ["none", "done", "missed", "excused"];
  const MAX_HISTORY = 60;

  let state;
  let unlocked = false;
  let gateMode = "unlock";
  let gateError = "";
  let saveTimer = null;
  let dragged = null;
  let undoStack = [];
  let redoStack = [];
  let activeArea = "today";
  let openAnalysisViews = new Set(["general"]);
  let lastMarkedCell = "";
  let animateArea = false;

  function uid(prefix) {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function normalizeName(value) {
    return String(value || "").trim().toLocaleLowerCase("pt-BR").replace(/\s+/g, " ");
  }

  function isoFromDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function dateFromISO(iso) {
    const [y, m, d] = String(iso).split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(iso, amount) {
    const date = dateFromISO(iso);
    date.setDate(date.getDate() + amount);
    return isoFromDate(date);
  }

  function diffDays(fromISO, toISO) {
    return Math.round((dateFromISO(toISO) - dateFromISO(fromISO)) / 86400000);
  }

  function formatDateShort(iso) {
    const d = dateFromISO(iso);
    return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getFullYear()).slice(-2)}`;
  }

  function formatDateLong(iso) {
    const d = dateFromISO(iso);
    return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
  }

  function parseShortDate(value) {
    const match = String(value).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);
    if (!match) return null;
    const day = Number(match[1]);
    const month = Number(match[2]);
    let year = Number(match[3]);
    if (year < 100) year += 2000;
    const date = new Date(year, month - 1, day);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
    return isoFromDate(date);
  }

  function monthKey(iso) {
    return String(iso).slice(0, 7);
  }

  function yearKey(iso) {
    return String(dateFromISO(iso).getFullYear());
  }

  function decadeKey(iso) {
    const year = dateFromISO(iso).getFullYear();
    return String(Math.floor(year / 10) * 10);
  }

  function formatMonthKey(key) {
    const [year, month] = key.split("-").map(Number);
    return `${MONTH_NAMES[month - 1][0].toUpperCase()}${MONTH_NAMES[month - 1].slice(1)} de ${year}`;
  }

  function hashPin(pin) {
    let h = 2166136261;
    for (let i = 0; i < pin.length; i++) {
      h ^= pin.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return `p6_${(h >>> 0).toString(16).padStart(8, "0")}`;
  }

  function validPin(pin) {
    return /^\d{6}$/.test(String(pin || ""));
  }

  function makeDefaultDefinitions(startISO) {
    const catRoutine = uid("cat");
    const catGrowth = uid("cat");
    const water = uid("task");
    const exercise = uid("task");
    const study = uid("task");
    const sleep = uid("task");
    return {
      categories: {
        [catRoutine]: { id: catRoutine, lineageId: catRoutine, title: "Rotina" },
        [catGrowth]: { id: catGrowth, lineageId: catGrowth, title: "Desenvolvimento" }
      },
      tasks: {
        [water]: { id: water, lineageId: water, title: "Beber água", categoryId: "", goal: { type: "daily", value: 1 }, anchorDate: startISO },
        [exercise]: { id: exercise, lineageId: exercise, title: "Exercício", categoryId: "", goal: { type: "weekly", value: 3 }, anchorDate: startISO },
        [study]: { id: study, lineageId: study, title: "Estudar", categoryId: "", goal: { type: "daily", value: 1 }, anchorDate: startISO },
        [sleep]: { id: sleep, lineageId: sleep, title: "Dormir cedo", categoryId: "", goal: { type: "daily", value: 1 }, anchorDate: startISO }
      },
      rows: [
        { id: uid("row"), type: "category", refId: catRoutine },
        { id: uid("row"), type: "task", refId: water },
        { id: uid("row"), type: "task", refId: exercise },
        { id: uid("row"), type: "category", refId: catGrowth },
        { id: uid("row"), type: "task", refId: study },
        { id: uid("row"), type: "task", refId: sleep }
      ]
    };
  }

  function makeWeek(startISO, rows) {
    return {
      id: uid("week"),
      rows: clone(rows || []),
      days: Array.from({ length: 7 }, (_, index) => ({ date: addDays(startISO, index) })),
      marks: {},
      pausedTasks: {},
      collapsed: false
    };
  }

  function defaultState() {
    const today = isoFromDate(new Date());
    const defs = makeDefaultDefinitions(today);
    return {
      version: VERSION,
      schemaMode: SCHEMA_MODE,
      theme: "light",
      security: { pinHash: "" },
      categories: defs.categories,
      tasks: defs.tasks,
      weeks: [makeWeek(today, defs.rows)],
      trash: [],
      today: { date: today, notes: "", collapsed: false },
      noteHistory: [],
      ui: {
        analysisWeekId: "",
        analysisMonthKey: "",
        calendarMonthKey: today.slice(0, 7),
        graph: { mode: "weekDays", scope: "", targetType: "all", targetId: "", compareType: "week", compareA: "", compareB: "" },
        search: "",
        modal: "",
        modalData: {},
        collapsedMonths: {},
        collapsedYears: {}
      }
    };
  }

  function normalizeState(candidate) {
    if (!candidate || candidate.version !== VERSION || candidate.schemaMode !== SCHEMA_MODE || !candidate.tasks || !candidate.categories) {
      return defaultState();
    }
    const s = clone(candidate);
    s.version = VERSION;
    s.schemaMode = SCHEMA_MODE;
    s.theme = s.theme === "dark" ? "dark" : "light";
    s.security = { pinHash: String(s.security?.pinHash || "") };
    s.categories = s.categories && typeof s.categories === "object" ? s.categories : {};
    s.tasks = s.tasks && typeof s.tasks === "object" ? s.tasks : {};
    Object.values(s.categories).forEach(category => {
      category.id = category.id || uid("cat");
      category.lineageId = category.lineageId || category.id;
      category.title = String(category.title || "Categoria");
    });
    Object.values(s.tasks).forEach(task => {
      task.id = task.id || uid("task");
      task.lineageId = task.lineageId || task.id;
      task.title = String(task.title || "Nova meta");
      task.categoryId = "";
      const type = ["daily", "weekly", "monthly", "interval"].includes(task.goal?.type) ? task.goal.type : "daily";
      task.goal = { type, value: Math.max(1, Number(task.goal?.value) || 1) };
      task.anchorDate = task.anchorDate || isoFromDate(new Date());
    });
    s.weeks = Array.isArray(s.weeks) ? s.weeks.map((week, index) => {
      const start = week.days?.[0]?.date || addDays(isoFromDate(new Date()), index * 7);
      const normalized = {
        id: week.id || uid("week"),
        rows: Array.isArray(week.rows) ? week.rows.filter(row => row && (row.type === "task" || row.type === "category")).map(row => ({
          id: row.id || uid("row"), type: row.type, refId: row.refId
        })).filter(row => row.type === "task" ? !!s.tasks[row.refId] : !!s.categories[row.refId]) : [],
        days: Array.from({ length: 7 }, (_, dayIndex) => ({ date: week.days?.[dayIndex]?.date || addDays(start, dayIndex) })),
        marks: {},
        pausedTasks: week.pausedTasks && typeof week.pausedTasks === "object" ? week.pausedTasks : {},
        collapsed: !!week.collapsed
      };
      Object.entries(week.marks || {}).forEach(([key, value]) => {
        if (["done", "missed", "excused"].includes(value)) normalized.marks[key] = value;
      });
      return normalized;
    }) : [];
    if (!s.weeks.length) {
      const defs = makeDefaultDefinitions(isoFromDate(new Date()));
      s.categories = defs.categories;
      s.tasks = defs.tasks;
      s.weeks = [makeWeek(isoFromDate(new Date()), defs.rows)];
    }
    s.trash = Array.isArray(s.trash) ? s.trash : [];
    s.today = { date: s.today?.date || isoFromDate(new Date()), notes: String(s.today?.notes || ""), collapsed: !!s.today?.collapsed };
    s.noteHistory = Array.isArray(s.noteHistory) ? s.noteHistory.map(note => ({
      ...note, id: note.id || uid("note"), date: note.date || s.today.date, text: String(note.text || "")
    })) : [];
    s.ui = {
      analysisWeekId: String(s.ui?.analysisWeekId || ""),
      analysisMonthKey: String(s.ui?.analysisMonthKey || ""),
      calendarMonthKey: String(s.ui?.calendarMonthKey || monthKey(s.today.date)),
      graph: {
        mode: ["weekDays", "monthWeeks", "yearMonths", "decadeYears", "comparePeriods"].includes(s.ui?.graph?.mode) ? s.ui.graph.mode : "weekDays",
        scope: String(s.ui?.graph?.scope || ""),
        targetType: ["all", "task", "category"].includes(s.ui?.graph?.targetType) ? s.ui.graph.targetType : "all",
        targetId: String(s.ui?.graph?.targetId || ""),
        compareType: ["week", "month", "year", "decade"].includes(s.ui?.graph?.compareType) ? s.ui.graph.compareType : "week",
        compareA: String(s.ui?.graph?.compareA || ""), compareB: String(s.ui?.graph?.compareB || "")
      },
      search: String(s.ui?.search || ""), modal: String(s.ui?.modal || ""), modalData: s.ui?.modalData && typeof s.ui.modalData === "object" ? s.ui.modalData : {},
      collapsedMonths: s.ui?.collapsedMonths && typeof s.ui.collapsedMonths === "object" ? s.ui.collapsedMonths : {},
      collapsedYears: s.ui?.collapsedYears && typeof s.ui.collapsedYears === "object" ? s.ui.collapsedYears : {}
    };
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      state = raw ? normalizeState(JSON.parse(raw)) : defaultState();
    } catch (error) {
      console.error(error);
      state = defaultState();
    }
    applyTheme();
    gateMode = state.security.pinHash ? "unlock" : "create";
    renderGate();
  }

  function saveNow() {
    try {
      const persist = clone(state);
      persist.ui.modal = "";
      persist.ui.modalData = {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persist));
      setStatus("Salvo ✓ neste navegador e neste computador");
    } catch (error) {
      console.error(error);
      setStatus("Não foi possível salvar os dados.");
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    setStatus("Salvando...");
    saveTimer = setTimeout(saveNow, 160);
  }

  function setStatus(text) {
    const el = document.getElementById("status");
    if (el) el.textContent = text;
  }

  function applyTheme() {
    document.body.dataset.theme = state.theme;
  }

  function snapshotState() {
    const snap = clone(state);
    snap.ui.modal = "";
    snap.ui.modalData = {};
    return snap;
  }

  function mutate(mutator, options = {}) {
    undoStack.push(snapshotState());
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
    mutator();
    state = normalizeState(state);
    applyTheme();
    if (options.render !== false) render();
    scheduleSave();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshotState());
    state = normalizeState(undoStack.pop());
    applyTheme();
    render();
    scheduleSave();
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshotState());
    state = normalizeState(redoStack.pop());
    applyTheme();
    render();
    scheduleSave();
  }

  function renderGate() {
    const creating = gateMode === "create";
    document.getElementById("app").innerHTML = `
      <div class="pin-gate">
        <section class="modal small">
          <div class="modal-body">
            <div class="pin-logo">🧠</div>
            <div style="text-align:center">
              <h1 style="margin:0 0 7px">CheckList ✅</h1>
              <p style="color:var(--muted);margin:0">${creating ? "Crie um PIN numérico de 6 dígitos para proteger esta base local." : "Digite o PIN desta base para acessar seus dados."}</p>
            </div>
            <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
            ${creating ? `<div class="pin-gate-field"><label class="pin-gate-label" for="pinConfirmInput">Repita o PIN</label><input id="pinConfirmInput" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div>` : ""}
            <div class="pin-error">${escapeHTML(gateError)}</div>
            <button class="primary" id="pinSubmitBtn">${creating ? "Criar PIN e entrar" : "Desbloquear"}</button>
            ${creating ? `<div class="pin-gate-import"><div class="pin-gate-or">ou</div><button class="primary" id="gateImportBtn">Importar backup existente</button><input id="gateImportInput" type="file" accept="application/json,.json" hidden></div>` : ""}
            <small style="color:var(--muted);text-align:center">Este é um bloqueio básico local. Não substitui criptografia forte do arquivo ou do computador.</small>
          </div>
        </section>
      </div><div class="app-version-badge" aria-label="Versão do aplicativo">v${APP_VERSION}</div>`;
    const input = document.getElementById("pinInput");
    input?.focus();
    const submit = () => {
      const pin = input.value;
      if (!validPin(pin)) {
        gateError = "O PIN deve ter exatamente 6 números.";
        renderGate();
        return;
      }
      if (creating) {
        const confirmPin = document.getElementById("pinConfirmInput")?.value || "";
        if (pin !== confirmPin) {
          gateError = "Os dois PINs são diferentes.";
          renderGate();
          return;
        }
        state.security.pinHash = hashPin(pin);
        saveNow();
      } else if (hashPin(pin) !== state.security.pinHash) {
        gateError = "PIN incorreto.";
        renderGate();
        return;
      }
      gateError = "";
      unlocked = true;
      render();
    };
    document.getElementById("pinSubmitBtn")?.addEventListener("click", submit);
    document.getElementById("gateImportBtn")?.addEventListener("click", () => document.getElementById("gateImportInput")?.click());
    document.getElementById("gateImportInput")?.addEventListener("change", event => importBackupFile(event.target.files?.[0], { fromGate: true }));
    document.querySelectorAll(".pin-input").forEach(el => el.addEventListener("keydown", event => {
      if (event.key === "Enter") submit();
    }));
  }

  function getWeek(weekId) {
    return state.weeks.find(week => week.id === weekId);
  }

  function getTask(taskId) {
    return state.tasks[taskId];
  }

  function getCategory(categoryId) {
    return state.categories[categoryId];
  }


  function taskRows(week) {
    return week.rows.filter(row => row.type === "task" && state.tasks[row.refId]);
  }

  function uniqueTaskIdsInWeek(week) {
    return [...new Set(taskRows(week).map(row => row.refId))];
  }

  function markKey(taskId, dayIndex) {
    return `${taskId}|${dayIndex}`;
  }


  function statusOf(week, taskId, dayIndex) {
    const value = week.marks[markKey(taskId, dayIndex)];
    return ["done", "missed", "excused"].includes(value) ? value : "none";
  }

  function taskIsPaused(week, taskId) {
    return !!week.pausedTasks?.[taskId];
  }

  function taskIsScheduled(task, iso) {
    if (!task) return false;
    if (task.goal.type === "interval") {
      const delta = diffDays(task.anchorDate, iso);
      return delta >= 0 && delta % Math.max(1, task.goal.value) === 0;
    }
    return true;
  }

  function goalLabel(task) {
    if (!task) return "Sem meta";
    if (task.goal.type === "daily") return "Todos os dias";
    if (task.goal.type === "weekly") return `${task.goal.value}x por semana`;
    if (task.goal.type === "monthly") return `${task.goal.value}x por mês`;
    return `A cada ${task.goal.value} ${task.goal.value === 1 ? "dia" : "dias"}`;
  }

  function weekContainingTask(taskId) {
    return state.weeks.find(week => week.rows.some(row => row.type === "task" && row.refId === taskId)) || null;
  }

  function weekContainingCategory(categoryId) {
    return state.weeks.find(week => week.rows.some(row => row.type === "category" && row.refId === categoryId)) || null;
  }

  function categoryForTaskInWeek(week, taskId) {
    if (!week) return null;
    let current = null;
    for (const row of week.rows) {
      if (row.type === "category") current = getCategory(row.refId) || null;
      else if (row.type === "task" && row.refId === taskId) return current;
    }
    return null;
  }


  function taskNameKey(task) { return normalizeName(task?.title || ""); }
  function categoryNameKey(category) { return normalizeName(category?.title || ""); }

  function syncTaskNameBackward(taskId, title) {
    const week = weekContainingTask(taskId);
    const task = getTask(taskId);
    if (!week || !task) return;
    const limit = state.weeks.indexOf(week);
    const lineageId = task.lineageId || task.id;
    state.weeks.forEach((item, index) => {
      if (index > limit) return;
      item.rows.forEach(row => {
        if (row.type !== "task") return;
        const candidate = getTask(row.refId);
        if (candidate && (candidate.lineageId || candidate.id) === lineageId) candidate.title = String(title || "Nova meta");
      });
    });
  }

  function syncCategoryNameBackward(categoryId, title) {
    const week = weekContainingCategory(categoryId);
    const category = getCategory(categoryId);
    if (!week || !category) return;
    const limit = state.weeks.indexOf(week);
    const lineageId = category.lineageId || category.id;
    state.weeks.forEach((item, index) => {
      if (index > limit) return;
      item.rows.forEach(row => {
        if (row.type !== "category") return;
        const candidate = getCategory(row.refId);
        if (candidate && (candidate.lineageId || candidate.id) === lineageId) candidate.title = String(title || "Categoria");
      });
    });
  }

  function weekForDate(iso) {
    const matches = state.weeks.filter(week => week.days.some(day => day.date === iso));
    return matches[matches.length - 1] || null;
  }

  function dayIndexForDate(week, iso) { return week ? week.days.findIndex(day => day.date === iso) : -1; }

  function allEntries() {
    const entries = [];
    state.weeks.forEach((week, weekIndex) => week.days.forEach((day, dayIndex) => entries.push({ week, weekIndex, dayIndex, date: day.date })));
    return entries.sort((a, b) => a.date.localeCompare(b.date) || a.weekIndex - b.weekIndex);
  }

  function uniqueEntriesByDate(entries = allEntries()) {
    const map = new Map(); entries.forEach(entry => map.set(entry.date, entry));
    return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
  }

  function taskOccurrences(entries, taskKey = "", targetType = "all", targetId = "") {
    const result = [];
    entries.forEach(entry => {
      if (entry.date > state.today.date) return;
      uniqueTaskIdsInWeek(entry.week).forEach(taskId => {
        const task = getTask(taskId);
        if (!task || (taskKey && taskNameKey(task) !== taskKey)) return;
        const category = categoryForTaskInWeek(entry.week, taskId);
        if (targetType === "task" && taskNameKey(task) !== targetId) return;
        if (targetType === "category" && categoryNameKey(category) !== targetId) return;
        if (taskIsPaused(entry.week, taskId) || !taskIsScheduled(task, entry.date)) return;
        result.push({ ...entry, taskId, task, category });
      });
    });
    return result;
  }

  function filteredTaskIds(entries, targetType = "all", targetId = "") {
    const map = new Map();
    taskOccurrences(entries, "", targetType, targetId).forEach(item => {
      const key = taskNameKey(item.task);
      if (key && !map.has(key)) map.set(key, item.task.title);
    });
    return [...map.keys()];
  }

  function targetForOccurrences(occurrences, kind) {
    const eligible = occurrences.filter(item => statusOf(item.week, item.taskId, item.dayIndex) !== "excused");
    if (!eligible.length) return 0;
    if (kind === "day") return eligible.length;
    let target = 0;
    const direct = eligible.filter(item => item.task.goal.type === "daily" || item.task.goal.type === "interval");
    target += direct.length;
    const weeklyGroups = new Map();
    eligible.filter(item => item.task.goal.type === "weekly").forEach(item => {
      const key = `${item.week.id}|${item.taskId}`;
      if (!weeklyGroups.has(key)) weeklyGroups.set(key, { value: item.task.goal.value, count: 0 });
      weeklyGroups.get(key).count += 1;
    });
    weeklyGroups.forEach(group => { target += Math.min(group.value, group.count); });
    const monthlyGroups = new Map();
    eligible.filter(item => item.task.goal.type === "monthly").forEach(item => {
      const key = monthKey(item.date);
      const current = monthlyGroups.get(key) || { value: 0, count: 0, latestDate: "" };
      current.count += 1;
      if (!current.latestDate || item.date >= current.latestDate) { current.value = item.task.goal.value; current.latestDate = item.date; }
      monthlyGroups.set(key, current);
    });
    monthlyGroups.forEach(group => { target += Math.min(group.value, group.count); });
    return target;
  }

  function taskPeriodStats(taskId, entries, kind, targetType = "all", targetId = "") {
    const taskKey = String(taskId || "");
    const occurrences = taskOccurrences(entries, taskKey, targetType, targetId);
    if (!occurrences.length) return null;
    const done = occurrences.reduce((sum, item) => sum + (statusOf(item.week, item.taskId, item.dayIndex) === "done" ? 1 : 0), 0);
    const excused = occurrences.reduce((sum, item) => sum + (statusOf(item.week, item.taskId, item.dayIndex) === "excused" ? 1 : 0), 0);
    const missed = occurrences.reduce((sum, item) => sum + (statusOf(item.week, item.taskId, item.dayIndex) === "missed" ? 1 : 0), 0);
    const target = targetForOccurrences(occurrences, kind);
    const rawPercent = target ? done / target * 100 : 0;
    const percent = target ? Math.min(100, Math.round(rawPercent)) : 0;
    const goals = [...new Set(occurrences.map(item => goalLabel(item.task)))];
    return {
      taskId: taskKey, title: occurrences[occurrences.length - 1].task.title,
      goal: goals.length === 1 ? goals[0] : goals.join(" → "), done, target, excused, missed, percent,
      percentLabel: done > target && target > 0 ? "+100%" : `${percent}%`, activeEntries: occurrences
    };
  }

  function aggregateStats(entries, kind, targetType = "all", targetId = "") {
    const tasks = filteredTaskIds(entries, targetType, targetId).map(key => taskPeriodStats(key, entries, kind, targetType, targetId)).filter(Boolean);
    const done = tasks.reduce((sum, item) => sum + item.done, 0);
    const target = tasks.reduce((sum, item) => sum + item.target, 0);
    const excused = tasks.reduce((sum, item) => sum + item.excused, 0);
    const missed = tasks.reduce((sum, item) => sum + item.missed, 0);
    const raw = target ? done / target * 100 : 0;
    return { tasks, done, target, excused, missed, percent: target ? Math.min(100, Math.round(raw)) : 0,
      percentLabel: done > target && target > 0 ? "+100%" : `${target ? Math.min(100, Math.round(raw)) : 0}%` };
  }

  function taskStreakStats(taskId, entries = uniqueEntriesByDate()) {
    const taskKey = String(taskId || "");
    const all = taskOccurrences(uniqueEntriesByDate(), taskKey).sort((a, b) => a.date.localeCompare(b.date));
    let run = 0, longest = 0;
    all.forEach(item => {
      const status = statusOf(item.week, item.taskId, item.dayIndex);
      if (status === "done") run += 1;
      else if (status !== "excused") run = 0;
      longest = Math.max(longest, run);
    });
    let current = 0;
    for (let i = all.length - 1; i >= 0; i--) {
      const status = statusOf(all[i].week, all[i].taskId, all[i].dayIndex);
      if (status === "done") current += 1;
      else if (status === "excused") continue;
      else break;
    }
    return { current, longest };
  }

  function categoryStreakStats(categoryId, entries = uniqueEntriesByDate()) {
    const categoryKey = String(categoryId || "");
    const sorted = uniqueEntriesByDate().filter(entry => entry.date <= state.today.date);

    function completionFor(entry) {
      const taskIds = uniqueTaskIdsInWeek(entry.week).filter(taskId => {
        const task = getTask(taskId);
        const category = categoryForTaskInWeek(entry.week, taskId);
        if (!task || categoryNameKey(category) !== categoryKey || taskIsPaused(entry.week, taskId) || !taskIsScheduled(task, entry.date)) return false;
        // Metas diárias/intervaladas têm expectativa explícita no dia. Metas semanais/mensais
        // entram no streak do dia quando receberam uma marcação nesse dia.
        if (task.goal.type === "daily" || task.goal.type === "interval") return true;
        return statusOf(entry.week, taskId, entry.dayIndex) !== "none";
      });
      if (!taskIds.length) return null;
      const relevant = taskIds.filter(taskId => statusOf(entry.week, taskId, entry.dayIndex) !== "excused");
      if (!relevant.length) return true;
      return relevant.every(taskId => statusOf(entry.week, taskId, entry.dayIndex) === "done");
    }

    let run = 0, longest = 0;
    sorted.forEach(entry => {
      const complete = completionFor(entry);
      if (complete === null) return;
      run = complete ? run + 1 : 0;
      longest = Math.max(longest, run);
    });

    let current = 0;
    for (let i = sorted.length - 1; i >= 0; i--) {
      const complete = completionFor(sorted[i]);
      if (complete === null) continue;
      if (complete) current += 1;
      else break;
    }
    return { current, longest };
  }

  function daySummary(entry) {
    if (!entry) return { scheduled: 0, possible: 0, done: 0, excused: 0, failures: 0, percent: 0, complete: false, symbol: "—", future: false };
    if (entry.date > state.today.date) return { scheduled: 0, possible: 0, done: 0, excused: 0, failures: 0, percent: 0, complete: false, symbol: "—", future: true };
    const taskIds = uniqueTaskIdsInWeek(entry.week).filter(taskId => {
      if (taskIsPaused(entry.week, taskId)) return false;
      const task = getTask(taskId); if (!taskIsScheduled(task, entry.date)) return false;
      if (task.goal.type === "daily" || task.goal.type === "interval") return true;
      return statusOf(entry.week, taskId, entry.dayIndex) !== "none";
    });
    if (!taskIds.length) return { scheduled: 0, possible: 0, done: 0, excused: 0, failures: 0, percent: 0, complete: false, symbol: "—", future: false };
    let done = 0, excused = 0, failures = 0;
    taskIds.forEach(taskId => {
      const status = statusOf(entry.week, taskId, entry.dayIndex);
      if (status === "done") done += 1;
      else if (status === "excused") excused += 1;
      else failures += 1;
    });
    const possible = taskIds.length - excused;
    const complete = failures === 0;
    const percent = possible ? Math.round(done / possible * 100) : 100;
    return { scheduled: taskIds.length, possible, done, excused, failures, percent, complete, symbol: complete ? "✓" : "✕", future: false };
  }

  function autoPercentClass(percent, scheduled = true) {
    if (!scheduled) return "day-none";
    if (percent >= 100) return "day-green";
    if (percent > 50) return "day-yellow";
    return "day-red";
  }

  function autoDayClass(week, dayIndex) {
    const day = week?.days?.[dayIndex];
    if (!day) return "day-none";
    const summary = daySummary({ week, weekIndex: state.weeks.indexOf(week), dayIndex, date: day.date });
    return autoPercentClass(summary.percent, !!summary.scheduled);
  }

  function perfectStreaks() {
    const entries = uniqueEntriesByDate().filter(entry => entry.date <= state.today.date);
    let current = 0, longest = 0, currentSegment = [], longestSegment = [];
    entries.forEach(entry => {
      const summary = daySummary(entry); if (!summary.scheduled) return;
      if (summary.complete) { current += 1; currentSegment.push(entry.date); }
      else { current = 0; currentSegment = []; }
      if (current > longest) { longest = current; longestSegment = [...currentSegment]; }
    });
    let currentCount = 0, currentDates = [];
    for (let i = entries.length - 1; i >= 0; i--) {
      const summary = daySummary(entries[i]); if (!summary.scheduled) continue;
      if (summary.complete) { currentCount += 1; currentDates.unshift(entries[i].date); }
      else break;
    }
    return { current: currentCount, longest, currentDates, recordDates: longestSegment };
  }

  function categoryStats(entries, kind) {
    const map = new Map();
    entries.forEach(entry => uniqueTaskIdsInWeek(entry.week).forEach(taskId => {
      const category = categoryForTaskInWeek(entry.week, taskId);
      const key = categoryNameKey(category);
      if (!map.has(key)) map.set(key, category?.title || "Sem categoria");
    }));
    return [...map.entries()].map(([key, title]) => {
      const aggregate = aggregateStats(entries, kind, "category", key);
      if (!aggregate.tasks.length) return null;
      return { category: { id: key, title }, ...aggregate, streak: categoryStreakStats(key) };
    }).filter(Boolean);
  }

  function currentWeekId() {
    const byToday = weekForDate(state.today.date);
    return byToday?.id || state.weeks[state.weeks.length - 1]?.id || "";
  }

  function availableMonthKeys() {

  function currentAnalysisWeekId() {

  function availableAnalysisYears() {
    const years = [...new Set(allEntries().map(entry => yearKey(entry.date)))];
    const todayYear = yearKey(state.today.date);

  function currentAnalysisMonthKey() {
    const fallback = monthKey(state.today.date);

    if (!/^\d{4}-\d{2}$/.test(value)) state.ui.analysisMonthKey = fallback;

  }

  function currentCalendarMonthKey() {
    const fallback = monthKey(state.today.date);
    const value = String(state.ui.calendarMonthKey || "");

  }

  function entriesForWeek(weekId) {
    const week = getWeek(weekId);
    return week ? week.days.map((day, dayIndex) => ({ week, weekIndex: state.weeks.indexOf(week), dayIndex, date: day.date })) : [];

  function setCellStatus(week, taskId, dayIndex, status) {

    const week = getWeek(weekId);
    if (!week || taskIsPaused(week, taskId) || !taskIsScheduled(getTask(taskId), week.days[dayIndex]?.date)) return;
    lastMarkedCell = `${weekId}|${taskId}|${dayIndex}`;
    mutate(() => {
      const current = statusOf(week, taskId, dayIndex);
      const next = STATUS_ORDER[(STATUS_ORDER.indexOf(current) + 1) % STATUS_ORDER.length];
      setCellStatus(week, taskId, dayIndex, next);
    });
    setTimeout(() => { lastMarkedCell = ""; }, 260);
  }


  function addTask(weekId) {
    const week = getWeek(weekId); if (!week) return;
    mutate(() => {
      const taskId = uid("task");
      state.tasks[taskId] = { id: taskId, lineageId: taskId, title: "Nova meta", categoryId: "", goal: { type: "daily", value: 1 }, anchorDate: week.days[0].date };

    mutate(() => {

  function renameCategory(categoryId, title) {

  function deleteTask(taskId) {
    const task = getTask(taskId);
    if (!task || !confirm(`Mover a atividade “${task.title}” e todo o histórico dela para a lixeira?`)) return;
    mutate(() => {
      const snapshot = { task: clone(task), placements: [], weekData: [] };
      state.weeks.forEach(week => {
        week.rows.forEach((row, index) => {
          if (row.type === "task" && row.refId === taskId) snapshot.placements.push({ weekId: week.id, row: clone(row), index });
        });
        const marks = {};
        Object.entries(week.marks).forEach(([key, value]) => { if (key.startsWith(`${taskId}|`)) marks[key] = value; });
        snapshot.weekData.push({ weekId: week.id, marks, paused: !!week.pausedTasks[taskId] });
        week.rows = week.rows.filter(row => !(row.type === "task" && row.refId === taskId));
        Object.keys(week.marks).forEach(key => { if (key.startsWith(`${taskId}|`)) delete week.marks[key]; });
        delete week.pausedTasks[taskId];
      });
      delete state.tasks[taskId];
      state.trash.unshift({ id: uid("trash"), type: "task", title: task.title, deletedAt: new Date().toISOString(), data: snapshot });
    });
  }

  function deleteCategory(categoryId) {
    const category = getCategory(categoryId);
    if (!category || !confirm(`Mover a categoria “${category.title}” para a lixeira? As atividades abaixo passarão a pertencer à categoria anterior, se houver.`)) return;
    mutate(() => {
      const placements = [];
      state.weeks.forEach(week => {
        week.rows.forEach((row, index) => { if (row.type === "category" && row.refId === categoryId) placements.push({ weekId: week.id, row: clone(row), index }); });
        week.rows = week.rows.filter(row => !(row.type === "category" && row.refId === categoryId));
      });
      delete state.categories[categoryId];
      state.trash.unshift({ id: uid("trash"), type: "category", title: category.title, deletedAt: new Date().toISOString(), data: { category: clone(category), placements, taskAssignments: [] } });
    });
  }
  function removeWeek(weekId) {
    if (state.weeks.length === 1) { alert("É necessário manter pelo menos uma semana."); return; }
    const week = getWeek(weekId);
    if (!week || !confirm("Mover esta semana e todas as marcações dela para a lixeira?")) return;
    mutate(() => {
      const index = state.weeks.indexOf(week);
      state.weeks.splice(index, 1);
      state.trash.unshift({ id: uid("trash"), type: "week", title: `Semana ${formatDateShort(week.days[0].date)}`, deletedAt: new Date().toISOString(), data: { week: clone(week), index } });
    });
  }

  function restoreTrash(trashId) {
    const item = state.trash.find(entry => entry.id === trashId);
    if (!item) return;
    mutate(() => {
      if (item.type === "week") {
        const index = Math.min(item.data.index, state.weeks.length);
        state.weeks.splice(index, 0, item.data.week);
      } else if (item.type === "task") {
        const snapshot = item.data;
        state.tasks[snapshot.task.id] = snapshot.task;
        snapshot.placements.forEach(place => {
          const week = getWeek(place.weekId);
          if (week && !week.rows.some(row => row.type === "task" && row.refId === snapshot.task.id)) {
            week.rows.splice(Math.min(place.index, week.rows.length), 0, place.row);
          }
        });
        snapshot.weekData.forEach(data => {
          const week = getWeek(data.weekId);
          if (!week) return;
          Object.assign(week.marks, data.marks);
          if (data.paused) week.pausedTasks[snapshot.task.id] = true;
        });
      } else if (item.type === "category") {
        state.categories[item.data.category.id] = item.data.category;
        item.data.placements.forEach(place => {
          const week = getWeek(place.weekId);
          if (week && !week.rows.some(row => row.type === "category" && row.refId === item.data.category.id)) {
            week.rows.splice(Math.min(place.index, week.rows.length), 0, place.row);
          }
        });
        (item.data.taskAssignments || []).forEach(taskId => { if (state.tasks[taskId]) state.tasks[taskId].categoryId = item.data.category.id; });
      }
      state.trash = state.trash.filter(entry => entry.id !== trashId);
      state.ui.modal = "trash";
    });
  }

  function permanentlyDeleteTrash(trashId) {
    if (!confirm("Excluir este item definitivamente?")) return;
    mutate(() => {
      state.trash = state.trash.filter(entry => entry.id !== trashId);
      state.ui.modal = "trash";
    });
  }


  function reorderRow(weekId, sourceId, targetId) {
    const week = getWeek(weekId);
    if (!week || sourceId === targetId) return;
    const sourceIndex = week.rows.findIndex(row => row.id === sourceId);
    const targetIndex = week.rows.findIndex(row => row.id === targetId);
    if (sourceIndex < 0 || targetIndex < 0) return;
    mutate(() => {
      const [row] = week.rows.splice(sourceIndex, 1);
      week.rows.splice(targetIndex, 0, row);
    });
  }

  function togglePause(weekId, taskId) {
    const week = getWeek(weekId);
    if (!week) return;
    mutate(() => {
      if (week.pausedTasks[taskId]) delete week.pausedTasks[taskId];
      else week.pausedTasks[taskId] = true;
    });
  }

  function updateDate(weekId, dayIndex, value) {
    const parsed = parseShortDate(value);
    if (!parsed) { alert("Data inválida. Use DD/MM/AA ou DD/MM/AAAA."); render(); return; }
    const week = getWeek(weekId);
    if (!week) return;
    mutate(() => { week.days[dayIndex].date = parsed; });
  }


  function createNextWeek() {
    const previous = state.weeks[state.weeks.length - 1];
    const dates = previous.days.map(day => day.date).sort();
    const start = addDays(dates[dates.length - 1], 1);
    mutate(() => {
      const taskMap = new Map(); const categoryMap = new Map(); const rows = [];
      previous.rows.forEach(row => {
        if (row.type === "category") {
          const source = getCategory(row.refId); if (!source) return;
          const id = uid("cat"); categoryMap.set(row.refId, id);
          state.categories[id] = { ...clone(source), id, lineageId: source.lineageId || source.id };
          rows.push({ id: uid("row"), type: "category", refId: id });
        } else {
          const source = getTask(row.refId); if (!source) return;
          const id = uid("task"); taskMap.set(row.refId, id);
          state.tasks[id] = { ...clone(source), id, lineageId: source.lineageId || source.id, categoryId: "", anchorDate: source.goal.type === "interval" ? source.anchorDate : start };
          rows.push({ id: uid("row"), type: "task", refId: id });
        }
      });
      const newWeek = makeWeek(start, rows);
      state.weeks.push(newWeek); state.ui.analysisWeekId = newWeek.id;
    });
    requestAnimationFrame(() => document.querySelector(".week-card:last-of-type")?.scrollIntoView({ behavior: "smooth", block: "start" }));
  }
  function goToCurrentWeek() {
    const realToday = isoFromDate(new Date());
    const week = weekForDate(realToday);
    if (!week) {
      setStatus(`Nenhuma semana contém a data atual (${formatDateLong(realToday)}).`);
      return;
    }
    week.days.forEach(day => {
      delete state.ui.collapsedMonths[monthKey(day.date)];
      delete state.ui.collapsedYears[yearKey(day.date)];
    });
    render();
    scheduleSave();
    requestAnimationFrame(() => document.querySelector(`[data-week-card="${week.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  }

  function toggleWeekCollapse(weekId) {

    if (!week) return;
    mutate(() => { week.collapsed = !week.collapsed; });
  }

  function toggleTheme() {
    mutate(() => { state.theme = state.theme === "dark" ? "light" : "dark"; });
  }


  function archiveTodayNotes(oldDate) {
    const text = String(state.today.notes || "").trim();
    if (!text) return;
    const existing = state.noteHistory.find(note => note.date === oldDate);
    if (existing) { existing.text = text; existing.archivedAt = new Date().toISOString(); }
    else state.noteHistory.unshift({ id: uid("note"), date: oldDate, text, archivedAt: new Date().toISOString() });
