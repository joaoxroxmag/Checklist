  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(snapshotState(), null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `backup_checklist_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus("Backup completo criado.");
  }

  function importBackupFile(file, options = {}) {
    if (!file) return;
    const fromGate = !!options.fromGate;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || "{}"));
        if (parsed?.version !== VERSION || parsed?.schemaMode !== SCHEMA_MODE) throw new Error("Backup incompatível com a v10.5");
        const imported = normalizeState(parsed);
        if (imported.security.pinHash) {
          const pin = prompt("Digite o PIN de 6 dígitos da base importada:");
          if (!pin || hashPin(pin) !== imported.security.pinHash) {
            alert("PIN incorreto. A importação foi cancelada.");
            return;
          }
        } else if (fromGate) {
          alert("Este backup não possui um PIN válido. A importação pela tela inicial foi cancelada.");
          return;
        } else {
          imported.security.pinHash = state.security.pinHash;
        }
        const confirmationText = fromGate
          ? "Importar este backup e usar o PIN dele para acessar o checklist?"
          : "A importação substituirá todos os dados atuais. Continuar?";
        if (!confirm(confirmationText)) return;
        if (!fromGate) undoStack.push(snapshotState());
        redoStack = [];
        state = imported;
        applyTheme();
        state.ui.modal = "";
        saveNow();
        if (fromGate) {
          gateError = "";
          gateMode = "unlock";
          unlocked = true;
          render();
          alert("Backup importado com sucesso.");
        } else {
          render();
          alert("Backup importado. Os dados anteriores podem ser recuperados imediatamente com Ctrl+Z enquanto esta página permanecer aberta.");
        }
      } catch (error) {
        console.error(error);
        alert("O arquivo não é um backup válido deste checklist.");
      }
    };
    reader.readAsText(file);
  }

  function graphScopeOptions(mode) {
    const entries = allEntries();
    if (mode === "weekDays") {
      return state.weeks.map((week, index) => ({ value: week.id, label: `Semana ${index + 1} — ${formatDateShort(week.days[0].date)} a ${formatDateShort(week.days[6].date)}` }));
    }
    if (mode === "monthWeeks") {
      return [...new Set(entries.map(entry => monthKey(entry.date)))].sort().map(key => ({ value: key, label: formatMonthKey(key) }));
    }
    if (mode === "yearMonths") {
      return [...new Set(entries.map(entry => yearKey(entry.date)))].sort().map(year => ({ value: year, label: `Ano ${year}` }));
    }
    return [...new Set(entries.map(entry => decadeKey(entry.date)))].sort().map(decade => ({ value: decade, label: `Década de ${decade}` }));
  }

  function graphTargetOptions(type) {
    if (type === "task") {
      const map = new Map(); Object.values(state.tasks).forEach(task => { const key = taskNameKey(task); if (key) map.set(key, task.title); });
      return [...map.entries()].sort((a,b) => a[1].localeCompare(b[1], "pt-BR")).map(([value,label]) => ({ value, label }));
    }
    if (type === "category") {
      const map = new Map(); Object.values(state.categories).forEach(category => { const key = categoryNameKey(category); if (key) map.set(key, category.title); });
      map.set("", "Sem categoria");
      return [...map.entries()].sort((a,b) => a[1].localeCompare(b[1], "pt-BR")).map(([value,label]) => ({ value, label }));
    }
    return [];
  }
  function comparePeriodOptions(type) {
    if (type === "week") return state.weeks.map((week, index) => ({ value: week.id, label: `Semana ${index + 1} — ${formatDateShort(week.days[0].date)} a ${formatDateShort(week.days[6].date)}` }));
    if (type === "month") return availableMonthKeys().map(key => ({ value: key, label: formatMonthKey(key) }));
    if (type === "year") return [...new Set(allEntries().map(entry => yearKey(entry.date)))].sort().map(year => ({ value: year, label: `Ano ${year}` }));
    return [...new Set(allEntries().map(entry => decadeKey(entry.date)))].sort().map(decade => ({ value: decade, label: `Década de ${decade}` }));
  }

  function entriesForComparePeriod(type, value) {
    if (type === "week") return entriesForWeek(value);
    if (type === "month") return entriesForMonth(value);
    if (type === "year") return entriesForYear(value);
    return entriesForDecade(value);
  }

  function comparePeriodKind(type) {
    return type === "week" ? "week" : type === "month" ? "month" : type === "year" ? "year" : "decade";
  }

  function normalizeGraphConfig(config = state.ui.graph) {
    const mode = ["weekDays", "monthWeeks", "yearMonths", "decadeYears", "comparePeriods"].includes(config.mode) ? config.mode : "weekDays";
    const targetType = ["all", "task", "category"].includes(config.targetType) ? config.targetType : "all";
    const targetOptions = graphTargetOptions(targetType);
    const targetId = targetType === "all" ? "" : (targetOptions.some(option => option.value === config.targetId) ? config.targetId : (targetOptions[0]?.value || ""));
    const compareType = ["week", "month", "year", "decade"].includes(config.compareType) ? config.compareType : "week";
    const compareOptions = comparePeriodOptions(compareType);
    const compareA = compareOptions.some(option => option.value === config.compareA) ? config.compareA : (compareOptions[0]?.value || "");
    const fallbackB = compareOptions[1]?.value || compareOptions[0]?.value || "";
    const compareB = compareOptions.some(option => option.value === config.compareB) ? config.compareB : fallbackB;
    if (mode === "comparePeriods") return { mode, scope: "", targetType, targetId, compareType, compareA, compareB };
    const scopeOptions = graphScopeOptions(mode);
    const scope = scopeOptions.some(option => option.value === config.scope) ? config.scope : (scopeOptions[0]?.value || "");
    return { mode, scope, targetType, targetId, compareType, compareA, compareB };
  }

  function targetLabel(type, id) {
    if (type === "all") return "Todas as atividades";
    return graphTargetOptions(type).find(option => option.value === id)?.label || (type === "task" ? "Meta" : "Categoria");
  }
  function graphDataFor(config) {
    const cfg = normalizeGraphConfig(config);
    if (cfg.mode === "comparePeriods") {
      const options = comparePeriodOptions(cfg.compareType);
      const aLabel = options.find(option => option.value === cfg.compareA)?.label || "Período A";
      const bLabel = options.find(option => option.value === cfg.compareB)?.label || "Período B";
      const kind = comparePeriodKind(cfg.compareType);
      const aStats = aggregateStats(entriesForComparePeriod(cfg.compareType, cfg.compareA), kind, cfg.targetType, cfg.targetId);
      const bStats = aggregateStats(entriesForComparePeriod(cfg.compareType, cfg.compareB), kind, cfg.targetType, cfg.targetId);
      const typeLabel = cfg.compareType === "week" ? "semanas" : cfg.compareType === "month" ? "meses" : cfg.compareType === "year" ? "anos" : "décadas";
      return { ...cfg, title: `Comparação entre ${typeLabel}`, scopeLabel: `${aLabel} × ${bLabel}`, targetLabel: targetLabel(cfg.targetType, cfg.targetId), points: [
        { label: aLabel, value: aStats.percent }, { label: bLabel, value: bStats.percent }
      ] };
    }

    const options = graphScopeOptions(cfg.mode);
    const scopeLabel = options.find(option => option.value === cfg.scope)?.label || "Sem dados";
    let points = [];
    let title = "";
    if (cfg.mode === "weekDays") {
      const week = getWeek(cfg.scope);
      title = "Variação entre os dias da semana";
      if (week) {
        points = week.days.map((day, dayIndex) => {
          if (day.date > state.today.date) return null;
          const entry = { week, weekIndex: state.weeks.indexOf(week), dayIndex, date: day.date };
          const stats = aggregateStats([entry], "day", cfg.targetType, cfg.targetId);
          return { label: `${WEEKDAY_NAMES[dateFromISO(day.date).getDay()]} ${formatDateShort(day.date).slice(0, 5)}`, value: stats.percent };
        }).filter(Boolean);
      }
    } else if (cfg.mode === "monthWeeks") {
      title = "Variação entre as semanas do mês";
      const key = cfg.scope;
      points = state.weeks.map((week, weekIndex) => {
        const entries = entriesForWeek(week.id).filter(entry => monthKey(entry.date) === key && entry.date <= state.today.date);
        if (!entries.length) return null;
        const stats = aggregateStats(entries, "week", cfg.targetType, cfg.targetId);
        const dates = entries.map(entry => entry.date).sort();
        return { label: `S${weekIndex + 1} ${formatDateShort(dates[0]).slice(0, 5)}–${formatDateShort(dates[dates.length - 1]).slice(0, 5)}`, value: stats.percent };
      }).filter(Boolean);
    } else if (cfg.mode === "yearMonths") {
      title = "Variação entre os meses do ano";
      const year = cfg.scope;
      for (let month = 1; month <= 12; month++) {
        const key = `${year}-${String(month).padStart(2, "0")}`;
        const entries = entriesForMonth(key).filter(entry => entry.date <= state.today.date);
        if (!entries.length) continue;
        const stats = aggregateStats(entries, "month", cfg.targetType, cfg.targetId);
        points.push({ label: MONTH_NAMES[month - 1].slice(0, 3), value: stats.percent });
      }
    } else {
      title = "Variação entre os anos da década";
      const decade = Number(cfg.scope);
      for (let year = decade; year <= decade + 9; year++) {
        const entries = entriesForYear(year).filter(entry => entry.date <= state.today.date);
        if (!entries.length) continue;
        const stats = aggregateStats(entries, "year", cfg.targetType, cfg.targetId);
        points.push({ label: String(year), value: stats.percent });
      }
    }
    return { ...cfg, title, scopeLabel, targetLabel: targetLabel(cfg.targetType, cfg.targetId), points };
  }

  function renderLineChart(graph) {
    if (!graph.points.length) return `<div class="chart-empty">Não há dados para esta comparação.</div>`;
    const width = 960;
    const height = 380;
    const left = 62;
    const right = 28;
    const top = 34;
    const bottom = 82;
    const plotWidth = width - left - right;
    const plotHeight = height - top - bottom;
    const pointInset = 40;
    const dataLeft = left + pointInset;
    const dataRight = width - right - 18;
    const dataWidth = Math.max(1, dataRight - dataLeft);
    const xFor = index => graph.points.length === 1 ? dataLeft + dataWidth / 2 : dataLeft + index * dataWidth / (graph.points.length - 1);
    const yFor = value => top + (100 - value) * plotHeight / 100;
    const grid = [0, 25, 50, 75, 100].map(value => {
      const y = yFor(value);
      return `<line class="chart-grid" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line><text class="chart-y-label" x="${left - 10}" y="${y + 4}" text-anchor="end">${value}%</text>`;
    }).join("");
    const pointString = graph.points.map((point, index) => `${xFor(index)},${yFor(point.value)}`).join(" ");
    const labels = graph.points.map((point, index) => {
      const x = xFor(index);
      const y = yFor(point.value);
      return `<circle class="chart-point" cx="${x}" cy="${y}" r="6"></circle><text class="chart-value" x="${x}" y="${Math.max(18, y - 13)}" text-anchor="middle">${point.value}%</text><text class="chart-label" x="${x}" y="${height - 38}" text-anchor="end" transform="rotate(-28 ${x} ${height - 38})">${escapeHTML(point.label)}</text>`;
    }).join("");
    return `<div class="graph-box"><svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHTML(graph.title)}"><line class="chart-axis" x1="${left}" y1="${top}" x2="${left}" y2="${height - bottom}"></line><line class="chart-axis" x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}"></line>${grid}<polyline class="chart-line" points="${pointString}"></polyline>${labels}</svg></div>`;
  }

  function renderGraphAnalysis() {
    state.ui.graph = normalizeGraphConfig(state.ui.graph);
    const graph = graphDataFor(state.ui.graph);
    const modeButtons = [
      ["weekDays", "Dias da semana"], ["monthWeeks", "Semanas do mês"], ["yearMonths", "Meses do ano"], ["decadeYears", "Anos da década"], ["comparePeriods", "Comparar períodos"]
    ].map(([mode, label]) => `<button class="graph-mode-btn ${state.ui.graph.mode === mode ? "active" : ""}" data-graph-mode="${mode}">${label}</button>`).join("");
    const targetTypes = [["all","Todas as atividades"],["task","Uma meta específica"],["category","Uma categoria específica"]]
      .map(([type,label]) => `<option value="${type}" ${state.ui.graph.targetType === type ? "selected" : ""}>${label}</option>`).join("");
    const targetOptions = graphTargetOptions(state.ui.graph.targetType).map(option => `<option value="${escapeHTML(option.value)}" ${option.value === state.ui.graph.targetId ? "selected" : ""}>${escapeHTML(option.label)}</option>`).join("");

    let periodControls = "";
    if (state.ui.graph.mode === "comparePeriods") {
      const compareTypes = [["week","Semanas"],["month","Meses"],["year","Anos"],["decade","Décadas"]]
        .map(([value,label]) => `<option value="${value}" ${state.ui.graph.compareType === value ? "selected" : ""}>${label}</option>`).join("");
      const compareOptions = comparePeriodOptions(state.ui.graph.compareType);
      const optionsA = compareOptions.map(option => `<option value="${escapeHTML(option.value)}" ${option.value === state.ui.graph.compareA ? "selected" : ""}>${escapeHTML(option.label)}</option>`).join("");
      const optionsB = compareOptions.map(option => `<option value="${escapeHTML(option.value)}" ${option.value === state.ui.graph.compareB ? "selected" : ""}>${escapeHTML(option.label)}</option>`).join("");
      periodControls = `<label>Ordem<select class="graph-select" id="graphCompareTypeSelect">${compareTypes}</select></label><label>Período A<select class="graph-select" id="graphCompareASelect">${optionsA}</select></label><label>Período B<select class="graph-select" id="graphCompareBSelect">${optionsB}</select></label>`;
    } else {
      const scopes = graphScopeOptions(state.ui.graph.mode).map(option => `<option value="${escapeHTML(option.value)}" ${option.value === state.ui.graph.scope ? "selected" : ""}>${escapeHTML(option.label)}</option>`).join("");
      periodControls = `<label>Período<select class="graph-select" id="graphScopeSelect">${scopes}</select></label>`;
    }

    return `<div class="analysis-section graph-panel"><h3>${escapeHTML(graph.title)}</h3><div class="analysis-subtitle">${escapeHTML(graph.scopeLabel)} • ${escapeHTML(graph.targetLabel)}</div><div class="graph-toolbar"><div class="graph-modes">${modeButtons}</div><div class="analysis-selector-row">${periodControls}<label>Conteúdo<select class="graph-select" id="graphTargetTypeSelect">${targetTypes}</select></label>${state.ui.graph.targetType === "all" ? "" : `<label>${state.ui.graph.targetType === "task" ? "Meta" : "Categoria"}<select class="graph-select" id="graphTargetIdSelect">${targetOptions}</select></label>`}</div></div>${renderLineChart(graph)}${state.ui.graph.mode === "comparePeriods" ? `<div class="comparison-note">Os dois períodos usam a mesma ordem e os cálculos são cortados na data definida em Hoje.</div>` : ""}</div>`;
  }


  function statusClass(status) {
    return status === "done" ? "filled" : status === "missed" ? "missed" : status === "excused" ? "excused" : "";
  }

  function statusSymbol(status) {
    return status === "done" ? "✓" : status === "missed" ? "✕" : status === "excused" ? "…" : "";
  }

  function renderTaskCell(week, task, dayIndex) {
    const date = week.days[dayIndex].date;
    const dayClass = autoDayClass(week, dayIndex);
    if (taskIsPaused(week, task.id)) return `<td class="check-cell ${dayClass}"><div class="paused-cell" title="Atividade pausada nesta semana">⏸</div></td>`;
    if (!taskIsScheduled(task, date)) return `<td class="check-cell ${dayClass}"><div class="paused-cell" title="Esta meta não está prevista neste dia">—</div></td>`;
    const status = statusOf(week, task.id, dayIndex);
    const animationClass = lastMarkedCell === `${week.id}|${task.id}|${dayIndex}` ? " just-marked" : "";
    return `<td class="check-cell ${dayClass}"><button class="cell-btn ${statusClass(status)}${animationClass}" data-toggle-cell="1" data-week="${week.id}" data-task="${task.id}" data-day="${dayIndex}" data-grid-cell="1" title="Vazio → concluída → não feita → justificada → vazio"><span class="box">${statusSymbol(status)}</span></button></td>`;
  }

  function filteredRowsForWeek(week) {
    const query = normalizeName(state.ui.search); if (!query) return week.rows;
    const matching = new Set(); let currentCategory = null;
    week.rows.forEach(row => {
      if (row.type === "category") { currentCategory = getCategory(row.refId); if (normalizeName(currentCategory?.title).includes(query)) matching.add(row.id); }
      else {
        const task = getTask(row.refId);
        if (normalizeName(task?.title).includes(query) || normalizeName(currentCategory?.title).includes(query)) matching.add(row.id);
      }
    });
    // Keep matching category headers for matching tasks.
    let lastCategoryRow = null;
    week.rows.forEach(row => { if (row.type === "category") lastCategoryRow = row; else if (matching.has(row.id) && lastCategoryRow) matching.add(lastCategoryRow.id); });
    return week.rows.filter(row => matching.has(row.id));
  }
  function renderWeekExpanded(week) {
    const rows = filteredRowsForWeek(week).map(row => {
      if (row.type === "category") {
        const category = getCategory(row.refId); if (!category) return "";
        return `<tr class="category-row sortable-row" draggable="true" data-week="${week.id}" data-row="${row.id}"><td colspan="8" class="category-full-cell"><div class="category-full"><span class="drag-handle" title="Arrastar categoria">↕</span><input class="category-input" value="${escapeHTML(category.title)}" data-category="${category.id}" aria-label="Nome da categoria"><button class="category-delete" data-delete-category="${category.id}" title="Mover categoria para a lixeira">🗑</button></div></td></tr>`;
      }
      const task = getTask(row.refId); if (!task) return "";
      return `<tr class="task-row sortable-row" draggable="true" data-week="${week.id}" data-row="${row.id}"><td><div class="meta-cell"><span class="drag-handle" title="Arrastar atividade">↕</span><div class="task-main"><div class="task-title">${escapeHTML(task.title)}</div><div class="task-badges"><span class="tiny-badge">🎯 ${escapeHTML(goalLabel(task))}</span>${taskIsPaused(week, task.id) ? `<span class="tiny-badge">⏸ pausada</span>` : ""}</div></div><div class="row-tools"><button data-edit-task="${task.id}" data-week="${week.id}" title="Editar meta e frequência">⚙</button><button data-pause-task="${task.id}" data-week="${week.id}" title="Pausar ou retomar nesta semana">⏸</button><button class="remove-row" data-delete-task="${task.id}" title="Mover atividade para a lixeira">🗑</button></div></div></td>${week.days.map((_, dayIndex) => renderTaskCell(week, task, dayIndex)).join("")}</tr>`;
    }).join("");
    const headers = week.days.map((day, dayIndex) => { const d = dateFromISO(day.date); return `<th class="${autoDayClass(week, dayIndex)}"><div class="day-header"><span class="day-name">${WEEKDAY_NAMES[d.getDay()]}</span><input class="date-input" data-week="${week.id}" data-day="${dayIndex}" value="${formatDateShort(day.date)}"></div></th>`; }).join("");
    const percentages = week.days.map((day, dayIndex) => { const summary = daySummary({ week, weekIndex: state.weeks.indexOf(week), dayIndex, date: day.date }); return `<td class="${autoPercentClass(summary.percent, !!summary.scheduled)}">${summary.future ? "—" : `${summary.percent}%`}</td>`; }).join("");
    return `<div class="week-scroll"><div class="table-shell"><table><colgroup><col class="meta-col">${"<col class=\"day-col\">".repeat(7)}</colgroup><thead><tr><th class="meta-head">Meta</th>${headers}</tr></thead><tbody>${rows || `<tr><td colspan="8"><div class="empty-state">Nenhuma linha corresponde ao filtro.</div></td></tr>`}</tbody><tfoot><tr><td class="daily-label">Conclusão do dia</td>${percentages}</tr></tfoot></table></div></div>`;
  }

  function renderWeekCollapsed(week) {
    const summaries = week.days.map((day, dayIndex) => daySummary({ week, weekIndex: state.weeks.indexOf(week), dayIndex, date: day.date }));
    const headers = week.days.map((day, dayIndex) => { const d = dateFromISO(day.date); const summary = summaries[dayIndex]; return `<th class="${autoPercentClass(summary.percent, !!summary.scheduled)}"><div class="day-header"><span class="day-name">${WEEKDAY_NAMES[d.getDay()]}</span><span>${formatDateShort(day.date)}</span></div></th>`; }).join("");
    const status = summaries.map(summary => `<td class="${autoPercentClass(summary.percent, !!summary.scheduled)}"><div class="status-square ${summary.symbol === "✓" ? "status-good" : summary.symbol === "✕" ? "status-bad" : "status-none"}">${summary.symbol}</div></td>`).join("");
    const percentages = summaries.map(summary => `<td class="${autoPercentClass(summary.percent, !!summary.scheduled)}">${summary.future ? "—" : `${summary.percent}%`}</td>`).join("");
    return `<div class="week-scroll"><div class="table-shell"><table class="collapsed-table"><colgroup><col class="meta-col">${"<col class=\"day-col\">".repeat(7)}</colgroup><thead><tr><th class="meta-head">Meta</th>${headers}</tr></thead><tbody><tr><td style="font-weight:900;padding:8px">Status automático</td>${status}</tr></tbody><tfoot><tr><td class="daily-label">Conclusão do dia</td>${percentages}</tr></tfoot></table></div></div>`;
  }
  function weekHiddenByCollapsedPeriods(week) {
    const months = [...new Set(week.days.map(day => monthKey(day.date)))];
    return months.every(key => !!state.ui.collapsedMonths[key]);
  }

  function renderWeek(week, index) {
    return `<section class="week-card ${week.collapsed ? "collapsed" : ""} ${weekHiddenByCollapsedPeriods(week) ? "week-hidden-by-period" : ""}" data-week-card="${week.id}">
      <div class="week-head"><div class="week-title-wrap"><div class="week-title">Semana ${index + 1}</div><div class="week-range">${formatDateShort(week.days[0].date)} a ${formatDateShort(week.days[6].date)}</div></div><div class="week-actions"><button data-toggle-week="${week.id}">${week.collapsed ? "Expandir semana" : "Minimizar semana"}</button><button data-add-task="${week.id}">+ meta</button><button data-add-category="${week.id}">+ categoria</button><button class="danger" data-remove-week="${week.id}">🗑 Semana</button></div></div>
      ${week.collapsed ? renderWeekCollapsed(week) : renderWeekExpanded(week)}
    </section>`;
  }

  function monthCanCollapse(key) {
    const touching = state.weeks.filter(week => week.days.some(day => monthKey(day.date) === key));
    return touching.length > 0 && touching.every(week => week.collapsed);
  }

  function renderCollapsedMonth(key) {
    const groups = state.weeks.map((week, weekIndex) => {
      const entries = entriesForWeek(week.id).filter(entry => monthKey(entry.date) === key);
      if (!entries.length) return null;
      const stats = aggregateStats(entries, "week");
      const dates = entries.map(entry => entry.date).sort();
      return { weekIndex, stats, label: `S${weekIndex + 1}`, range: `${formatDateShort(dates[0]).slice(0,5)}–${formatDateShort(dates[dates.length-1]).slice(0,5)}` };
    }).filter(Boolean);
    const headers = groups.map(item => `<th class="${autoPercentClass(item.stats.percent, item.stats.target > 0)}">${item.label}<br><small>${item.range}</small></th>`).join("");
    const status = groups.map(item => `<td class="${autoPercentClass(item.stats.percent, item.stats.target > 0)}"><div class="status-square ${item.stats.percent >= 100 ? "status-good" : "status-bad"}">${item.stats.percent >= 100 ? "✓" : "✕"}</div></td>`).join("");
    const percentages = groups.map(item => `<td class="${autoPercentClass(item.stats.percent, item.stats.target > 0)}">${item.stats.percentLabel}</td>`).join("");
    return `<section class="period-card"><div class="period-head"><b>${formatMonthKey(key)} minimizado</b><button data-toggle-month="${key}">Expandir mês</button></div><div class="period-body"><table class="period-mini-table"><thead><tr><th>Semana</th>${headers}</tr></thead><tbody><tr><td><b>Status</b></td>${status}</tr></tbody><tfoot><tr><td><b>Conclusão</b></td>${percentages}</tr></tfoot></table></div></section>`;
  }
  function renderCollapsedYear(year) {
    const months = availableMonthKeys().filter(key => key.startsWith(`${year}-`));
    const stats = months.map(key => aggregateStats(entriesForMonth(key), "month"));
    return `<section class="period-card"><div class="period-head"><b>Ano ${year} minimizado</b><button data-toggle-year="${year}">Expandir ano</button></div><div class="period-body"><table class="period-mini-table"><thead><tr><th>Mês</th>${months.map((key,i) => `<th class="${autoPercentClass(stats[i].percent, stats[i].target > 0)}">${MONTH_NAMES[Number(key.slice(5)) - 1].slice(0, 3)}</th>`).join("")}</tr></thead><tbody><tr><td><b>Status</b></td>${stats.map(item => `<td class="${autoPercentClass(item.percent, item.target > 0)}"><div class="status-square ${item.percent >= 100 ? "status-good" : "status-bad"}">${item.percent >= 100 ? "✓" : "✕"}</div></td>`).join("")}</tr></tbody><tfoot><tr><td><b>Conclusão</b></td>${stats.map(item => `<td class="${autoPercentClass(item.percent, item.target > 0)}">${item.percentLabel}</td>`).join("")}</tr></tfoot></table></div></section>`;
  }
  function renderPeriodControls() {
    const monthKeys = availableMonthKeys();
    const years = [...new Set(monthKeys.map(key => key.slice(0, 4)))];
    const cards = [];
    years.forEach(year => {
      const months = monthKeys.filter(key => key.startsWith(`${year}-`));
      const yearCan = months.length && months.every(key => !!state.ui.collapsedMonths[key]);
      if (state.ui.collapsedYears[year]) cards.push(renderCollapsedYear(year));
      else {
        months.forEach(key => {
          if (state.ui.collapsedMonths[key]) cards.push(renderCollapsedMonth(key));
          else if (monthCanCollapse(key)) cards.push(`<section class="period-card"><div class="period-head"><b>${formatMonthKey(key)}</b><span class="week-range">Todas as semanas desse mês estão minimizadas.</span><button data-toggle-month="${key}">Transformar em mês minimizado</button></div></section>`);
        });
        if (yearCan) cards.push(`<section class="period-card"><div class="period-head"><b>Ano ${year}</b><span class="week-range">Todos os meses com dados estão minimizados.</span><button data-toggle-year="${year}">Transformar em ano minimizado</button></div></section>`);
      }
    });
    return cards.length ? `<div class="periods-wrap">${cards.join("")}</div>` : "";
  }

  function renderToday() {
    const week = weekForDate(state.today.date);
    const dayIndex = dayIndexForDate(week, state.today.date);
    const entry = week && dayIndex >= 0 ? { week, weekIndex: state.weeks.indexOf(week), dayIndex, date: state.today.date } : null;
    const summary = daySummary(entry);
    let tasksHTML = `<div class="empty-state">Não existe uma semana contendo esta data. Crie ou ajuste uma semana.</div>`;
    if (entry) {
      const ids = uniqueTaskIdsInWeek(week).filter(taskId => !taskIsPaused(week, taskId) && taskIsScheduled(getTask(taskId), state.today.date));
      tasksHTML = ids.map(taskId => {
        const task = getTask(taskId);
        const status = statusOf(week, taskId, dayIndex);
        const category = categoryForTaskInWeek(week, taskId);
        return `<div class="today-task"><div><div class="today-task-title">${escapeHTML(task.title)}</div><div class="today-task-meta">${category ? `${escapeHTML(category.title)} • ` : ""}🎯 ${escapeHTML(goalLabel(task))}</div></div><div class="toolbar-group"><button class="today-state-btn ${statusClass(status)}${lastMarkedCell === `${week.id}|${taskId}|${dayIndex}` ? " just-marked" : ""}" data-toggle-cell="1" data-week="${week.id}" data-task="${taskId}" data-day="${dayIndex}" data-grid-cell="1" title="Vazio → concluída → não feita → justificada → vazio">${statusSymbol(status)}</button></div></div>`;
      }).join("") || `<div class="empty-state">Nenhuma atividade prevista para este dia.</div>`;
    }
    const todayStateChip = summary.complete ? `<span class="metric-chip">✓ Dia completo</span>` : (!summary.scheduled ? `<span class="metric-chip">— Sem metas</span>` : "");
    return `<section class="today-panel"><div class="today-head"><div class="today-head-copy"><b>Hoje em progresso</b><span>Acompanhe somente o que importa para a data atual do checklist.</span></div><div class="toolbar-group"><input id="todayDateInput" class="select-input" type="date" value="${state.today.date}"><button id="nextTodayBtn">Avançar dia →</button><button id="notesHistoryBtn">Histórico de notas</button><button id="toggleTodayBtn">${state.today.collapsed ? "Expandir" : "Minimizar"}</button></div></div>${state.today.collapsed ? "" : `<div class="today-body"><div class="today-stats"><span class="metric-chip">📅 ${formatDateLong(state.today.date)}</span><span class="metric-chip">✅ ${summary.done}/${summary.possible}</span><span class="metric-chip">📊 ${summary.percent}%</span>${todayStateChip}</div><div class="today-list">${tasksHTML}</div><div><label style="font-size:12px;font-weight:800">Notas temporárias deste dia</label><textarea id="todayNotes" class="today-note" placeholder="Estas notas ficam aqui até você avançar a data manualmente. Depois irão para o histórico.">${escapeHTML(state.today.notes)}</textarea></div></div>`}</section>`;
  }

  function statsTableRows(entries, kind) {
    const rows = [];
    categoryStats(entries, kind).forEach(cat => {
      const currentCat = cat.streak.current ? `🔥 ${cat.streak.current}` : "";
      rows.push(`<tr class="category-analysis-row"><td>📁 ${escapeHTML(cat.category.title)}</td><td>✅ ${cat.done}/${cat.target}</td><td>${currentCat}</td><td>🏆 ${cat.streak.longest}</td><td class="${cat.percentLabel === "+100%" ? "percent-over" : ""}">📊 ${cat.percentLabel}</td></tr>`);
      cat.tasks.sort((a,b) => a.title.localeCompare(b.title,"pt-BR")).forEach(item => {
        const streak = taskStreakStats(item.taskId);
        const currentTask = streak.current ? `🔥 ${streak.current}` : "";
        rows.push(`<tr><td><b>${escapeHTML(item.title)}</b><div class="analysis-subtitle">🎯 ${escapeHTML(item.goal)}${item.excused ? ` • ${item.excused} justificada(s)` : ""}</div></td><td>✅ ${item.done}/${item.target}</td><td>${currentTask}</td><td>🏆 ${streak.longest}</td><td class="${item.percentLabel === "+100%" ? "percent-over" : ""}">📊 ${item.percentLabel}</td></tr>`);
      });
    });
    return rows.join("") || `<tr><td colspan="5">Sem metas neste período.</td></tr>`;
  }

  function calendarSymbols(entry, streakInfo) {
    const summary = daySummary(entry); if (!summary.scheduled) return "—";
    const symbols = [summary.symbol];
    if (streakInfo.recordDates.includes(entry.date)) symbols.push("🏆");
    if (streakInfo.currentDates.includes(entry.date)) symbols.push("🔥");
    return symbols.join(" ");
  }
  function renderCalendarForMonth(key) {
    const [year, monthNumber] = key.split("-").map(Number);
    const month = monthNumber - 1;
    const firstDay = new Date(year, month, 1);
    const lastDate = new Date(year, month + 1, 0).getDate();
    const byDate = new Map(uniqueEntriesByDate(entriesForMonth(key)).map(entry => [entry.date, entry]));
    const streakInfo = perfectStreaks();
    const cells = [];
    for (let i = 0; i < firstDay.getDay(); i++) cells.push(`<div class="calendar-day empty"></div>`);
    for (let day = 1; day <= lastDate; day++) {
      const iso = isoFromDate(new Date(year, month, day));
      const entry = byDate.get(iso);
      if (!entry) {
        cells.push(`<div class="calendar-day"><strong>${day}</strong><small>—</small><div class="calendar-symbols">—</div></div>`);
        continue;
      }
      const summary = daySummary(entry);
      const symbols = calendarSymbols(entry, streakInfo);
      const recordClass = streakInfo.recordDates.includes(iso) ? "current-record" : "";
      cells.push(`<div class="calendar-day ${autoPercentClass(summary.percent, !!summary.scheduled)} ${recordClass}" title="${summary.future ? "Ainda não considerado" : `${summary.done}/${summary.possible}; ${summary.excused} justificadas`}"><strong>${day}</strong><small>${summary.future ? "—" : `${summary.percent}%`}</small><div class="calendar-symbols">${symbols}</div></div>`);
    }
    const monthStats = aggregateStats(entriesForMonth(key), "month");
    return `<div class="month-card"><h4>${formatMonthKey(key)}</h4><div class="month-total">📊 Conclusão: <strong>${monthStats.percentLabel}</strong> • ✅ ${monthStats.done}/${monthStats.target}</div><div class="calendar">${WEEKDAY_NAMES.map(name => `<div class="dow">${name}</div>`).join("")}${cells.join("")}</div><div class="legend"><span>✓ completo</span><span>✕ falhas</span><span>justificadas são ignoradas no percentual</span><span>🏆 recorde</span><span>🔥 streak atual</span><span>— sem metas</span></div></div>`;
  }

  function entriesBetween(startISO, endISO) {
    return allEntries().filter(entry => entry.date >= startISO && entry.date <= endISO && entry.date <= state.today.date);
  }

  function trendWindow(days) {
    const currentEnd = state.today.date;
    const currentStart = addDays(currentEnd, -(days - 1));
    const previousEnd = addDays(currentStart, -1);
    const previousStart = addDays(previousEnd, -(days - 1));
    const currentEntries = entriesBetween(currentStart, currentEnd);
    const previousEntries = entriesBetween(previousStart, previousEnd);
    const currentOverall = aggregateStats(currentEntries, "range");
    const keys = new Set([...filteredTaskIds(currentEntries), ...filteredTaskIds(previousEntries)]);
    const changes = [...keys].map(key => {
      const current = taskPeriodStats(key, currentEntries, "range");
      const previous = taskPeriodStats(key, previousEntries, "range");
      const currentPercent = current?.percent || 0;
      const previousPercent = previous?.percent || 0;
      const title = current?.title || previous?.title || key;
      return { key, title, currentPercent, previousPercent, delta: currentPercent - previousPercent, hasCurrent: !!current?.target, hasPrevious: !!previous?.target };
    }).filter(item => item.hasCurrent || item.hasPrevious);
    const improved = changes.filter(item => item.delta > 0).sort((a,b) => b.delta - a.delta || a.title.localeCompare(b.title,"pt-BR")).slice(0,3);
    const worsened = changes.filter(item => item.delta < 0).sort((a,b) => a.delta - b.delta || a.title.localeCompare(b.title,"pt-BR")).slice(0,3);
    return { days, currentStart, currentEnd, currentOverall, improved, worsened };
  }

  function renderTrendItems(items, direction) {
    if (!items.length) return `<div class="trend-neutral">Nenhuma mudança relevante.</div>`;
    return `<div class="trend-list">${items.map(item => `<div class="trend-row"><span>${escapeHTML(item.title)} <span style="color:var(--muted)">(${item.currentPercent}%)</span></span><span class="${direction === "up" ? "trend-positive" : "trend-negative"}">${item.delta > 0 ? "+" : ""}${item.delta} pp</span></div>`).join("")}</div>`;
  }

  function renderTrendPanel() {
    const windows = [7, 30, 90].map(trendWindow);
    return `<div><h2>Painel de tendências</h2><div class="analysis-subtitle">Cada janela termina na data definida em Hoje. Melhoras e pioras comparam a janela atual com a janela imediatamente anterior de mesmo tamanho.</div><div class="analysis-cards">${windows.map(item => `<div class="analysis-card"><span>Últimos ${item.days} dias</span><b>${item.currentOverall.percentLabel}</b><div class="analysis-subtitle">${formatDateShort(item.currentStart)} a ${formatDateShort(item.currentEnd)}</div><div style="margin-top:9px;font-weight:900">▲ Mais melhoraram</div>${renderTrendItems(item.improved,"up")}<div style="margin-top:11px;font-weight:900">▼ Mais pioraram</div>${renderTrendItems(item.worsened,"down")}</div>`).join("")}</div></div>`;
  }

  function renderAnalysis() {
    const weekId = currentAnalysisWeekId();
    const month = currentAnalysisMonthKey();

    }).join("");
    const calendarYearOptions = availableAnalysisYears().map(year => `<option value="${year}" ${year === calendarYear ? "selected" : ""}>${year}</option>`).join("");

    const allowedViews = ["general", "trends", "weekly", "monthly", "calendar", "graphs"];
    openAnalysisViews = new Set([...openAnalysisViews].filter(view => allowedViews.includes(view)));
    const options = [
      ["general", "📌", "Análise geral", "Resumo de streaks e dos principais resultados do período atual."],

      ["weekly", "🗓️", "Análise semanal", "Examine atividades e categorias de uma semana específica."],
      ["monthly", "📅", "Análise mensal", "Veja resultados consolidados de um mês escolhido."],
      ["calendar", "🧭", "Calendário", "Selecione mês e ano para visualizar desempenho, streaks e recordes."],
      ["graphs", "📊", "Variações e gráficos", "Compare períodos e acompanhe mudanças nas porcentagens."]
    ];
    const optionButtons = options.map(([id, icon, title, copy]) => `<button class="v9-analysis-choice ${openAnalysisViews.has(id) ? "active" : ""}" data-analysis-view="${id}" aria-expanded="${openAnalysisViews.has(id) ? "true" : "false"}"><span class="v9-analysis-choice-icon">${icon}</span><span><strong>${title}</strong><small>${copy}</small></span></button>`).join("");

    function contentFor(view) {
      if (view === "general") return `<div class="analysis-section"><h3>Análise geral</h3><div class="analysis-cards"><div class="analysis-card">🔥 Streak atual de dias completos<b>${streak.current} ${streak.current === 1 ? "dia" : "dias"}</b></div><div class="analysis-card">🏆 Maior streak all time<b>${streak.longest} ${streak.longest === 1 ? "dia" : "dias"}</b></div><div class="analysis-card">✅ Total da semana selecionada<b>${weekStats.done}/${weekStats.target}</b></div><div class="analysis-card">📊 Total do mês selecionado<b>${monthStats.percentLabel}</b></div></div></div>`;
      if (view === "trends") return `<div class="analysis-section">${renderTrendPanel()}</div>`;
      if (view === "weekly") return `<div><div class="analysis-selector-row"><label>Semana exibida<select class="graph-select" id="analysisWeekSelect">${weekOptions}</select></label></div><div class="analysis-section"><h3>${week ? `Semana — ${formatDateShort(week.days[0].date)} a ${formatDateShort(week.days[6].date)}` : "Semana"}</h3><div class="summary">✅ Realizadas: <strong>${weekStats.done}/${weekStats.target}</strong> • 📊 Percentual: <strong>${weekStats.percentLabel}</strong> • … Justificadas: ${weekStats.excused}</div><table class="analysis-table"><thead><tr><th>Atividade ou categoria</th><th>✅ Realizadas</th><th>🔥 Streak atual</th><th>🏆 Maior all time</th><th>📊 Percentual</th></tr></thead><tbody>${statsTableRows(weekEntries, "week")}</tbody></table></div></div>`;
      if (view === "monthly") return `<div><div class="analysis-selector-row"><label>Mês exibido<select class="graph-select" data-analysis-month-select="1">${monthOptions}</select></label></div><div class="analysis-section"><h3>${month ? formatMonthKey(month) : "Mês"}</h3><div class="summary monthly-summary">✅ Realizadas: <strong>${monthStats.done}/${monthStats.target}</strong> • 📊 Percentual geral: <strong>${monthStats.percentLabel}</strong> • … Justificadas: ${monthStats.excused}</div><table class="analysis-table"><thead><tr><th>Atividade ou categoria</th><th>✅ Realizadas</th><th>🔥 Streak atual</th><th>🏆 Maior all time</th><th>📊 Percentual</th></tr></thead><tbody>${statsTableRows(monthEntries, "month")}</tbody></table></div></div>`;
      if (view === "calendar") return `<div><div class="analysis-selector-row"><label>Mês<select class="graph-select" id="calendarMonthSelect">${calendarMonthOptions}</select></label><label>Ano<select class="graph-select" id="calendarYearSelect">${calendarYearOptions}</select></label></div><div class="month-grid">${renderCalendarForMonth(`${calendarYear}-${calendarMonth}`)}</div></div>`;
      return renderGraphAnalysis();
    }

    const content = allowedViews.filter(view => openAnalysisViews.has(view)).map(view => `<div class="v9-analysis-open-section" data-analysis-content="${view}">${contentFor(view)}</div>`).join("");
    const empty = content ? "" : `<div class="v9-analysis-empty">Selecione uma ou mais análises acima para exibir os dados.</div>`;
    return `<section class="analysis-panel" id="analysisPanel"><div class="analysis-content"><div class="v9-analysis-menu"><div class="v9-analysis-options">${optionButtons}</div></div><div class="v9-analysis-display">${content}${empty}</div></div></section>`;
  }

  function handleGlobalKeydown(event) {
    const target = event.target;
    const typing = !!(target && (target.matches?.("input,textarea,select") || target.isContentEditable));
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
      event.preventDefault();
      if (event.shiftKey) redo(); else undo();
      return;
    }
    if (event.key === "Escape") {
      if (state.ui.modal) { closeModal(); return; }
      if (activeArea !== "today") { setActiveArea("today"); return; }
      return;
    }
    if (typing) return;
    const key = event.key.toLowerCase();
    if (key === "n") { event.preventDefault(); activeArea = "planning"; addTask(currentWeekId()); return; }
    if (key === "c") { event.preventDefault(); activeArea = "planning"; addCategory(currentWeekId()); return; }
    if (key === "f") { event.preventDefault(); setActiveArea("planning", "globalSearch"); return; }
    if (key === "s") { event.preventDefault(); activeArea = "planning"; createNextWeek(); return; }

    const focused = document.activeElement?.matches?.("[data-grid-cell]") ? document.activeElement : null;
    if (!focused) return;
    const cells = [...document.querySelectorAll("[data-grid-cell]")];
    const index = cells.indexOf(focused);
    if (event.key === " ") { event.preventDefault(); focused.click(); return; }
    if (event.key === "Enter") {
      event.preventDefault();
      openModal("taskEditor", { taskId: focused.dataset.task, weekId: focused.dataset.week });
      return;
    }
    let nextIndex = index;
    if (event.key === "ArrowRight") nextIndex = index + 1;
    else if (event.key === "ArrowLeft") nextIndex = index - 1;
    else if (event.key === "ArrowDown") nextIndex = index + 7;
    else if (event.key === "ArrowUp") nextIndex = index - 7;
    else return;
    event.preventDefault();
    cells[nextIndex]?.focus();
  }

  function pdfSafe(text) {
    return String(text ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[–—]/g, "-")
      .replace(/✓/g, "OK")
      .replace(/✕/g, "X")
      .replace(/…/g, "...")
      .replace(/🔥/g, "STREAK")
      .replace(/🏆/g, "RECORDE")
      .replace(/✅/g, "FEITAS")
      .replace(/🎯/g, "META")
      .replace(/📊/g, "%")
      .replace(/📁/g, "CATEGORIA")
      .replace(/★/g, "*")
      .replace(/[^\x20-\x7E]/g, "?");
  }

  function pdfEscape(text) {
    return pdfSafe(text).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  }

  function wrapText(text, maxChars) {
    const words = pdfSafe(text).split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(word => {
      const next = line ? `${line} ${word}` : word;
      if (next.length > maxChars && line) { lines.push(line); line = word; }
      else line = next;
    });
    if (line) lines.push(line);
    return lines.length ? lines : [""];
  }

  function pdfRowsForPeriod(entries, kind) {
    const rows = [];
    const cats = categoryStats(entries, kind);
    cats.forEach(cat => {
      rows.push([`CATEGORIA: ${cat.category.title}`, `${cat.done}/${cat.target}`, cat.streak.current ? String(cat.streak.current) : "", String(cat.streak.longest), cat.percentLabel]);
      cat.tasks.forEach(item => {
        const streak = taskStreakStats(item.taskId);
        rows.push([`  ${item.title} (${item.goal})`, `${item.done}/${item.target}`, streak.current ? String(streak.current) : "", String(streak.longest), item.percentLabel]);
      });
    });
    return rows;
  }

    graphScopeOptions("weekDays").forEach(option => configs.push({ mode: "weekDays", scope: option.value, targetType: "all", targetId: "" }));

    graphScopeOptions("decadeYears").forEach(option => configs.push({ mode: "decadeYears", scope: option.value, targetType: "all", targetId: "" }));
    return configs;
  }

  function createPDFDocument() {
    const W = 595.28;
    const H = 841.89;
    const margin = 38;
    const pages = [];
    let page = [];
    let y = margin;

    function newPage() { page = []; pages.push(page); y = margin; }
    function text(x, top, size, content, bold = false) { page.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${x.toFixed(2)} ${(H - top).toFixed(2)} Td (${pdfEscape(content)}) Tj ET`); }
    function line(x1, top1, x2, top2, width = .5) { page.push(`${width} w ${x1.toFixed(2)} ${(H - top1).toFixed(2)} m ${x2.toFixed(2)} ${(H - top2).toFixed(2)} l S`); }
    function rect(x, top, w, h, fill = null, stroke = true) {
      if (fill) page.push(`${fill[0]} ${fill[1]} ${fill[2]} rg`);
      page.push(`${x.toFixed(2)} ${(H - top - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill ? (stroke ? "B" : "f") : "S"}`);
      page.push("0 0 0 rg");
    }
    function ensure(height) { if (y + height > H - margin) newPage(); }
    function heading(content, size = 16) { ensure(size + 18); text(margin, y + size, size, content, true); y += size + 12; }
    function paragraph(content, size = 9) {
      const lines = wrapText(content, 100);
      ensure(lines.length * (size + 3) + 5);
      lines.forEach((value, index) => text(margin, y + size + index * (size + 3), size, value));
      y += lines.length * (size + 3) + 6;
    }
    function table(headers, rows, widths) {
      const rowH = 22;
      function header() {
        let x = margin;
        headers.forEach((headerText, index) => {
          rect(x, y, widths[index], rowH, [.90, .93, .94]);
          text(x + 3, y + 14, 7.5, headerText, true);
          x += widths[index];
        });
        y += rowH;
      }
      ensure(rowH * 2);
      header();
      rows.forEach(row => {
        if (y + rowH > H - margin) { newPage(); header(); }
        let x = margin;
        row.forEach((cell, index) => {
          const isCategory = String(row[0]).startsWith("CATEGORIA:");
          rect(x, y, widths[index], rowH, isCategory ? [.94, .96, .97] : null);
          const max = Math.max(4, Math.floor(widths[index] / 4.5));
          text(x + 3, y + 14, 7.5, pdfSafe(cell).slice(0, max), isCategory);
          x += widths[index];
        });
        y += rowH;
      });
      y += 10;
    }
    function chart(graph) {
      const chartBlock = 250;
      ensure(chartBlock + 50);
      text(margin, y + 13, 12, graph.title, true);
      text(margin, y + 29, 8, `${graph.scopeLabel} - ${graph.targetLabel}`);
      y += 40;
      if (!graph.points.length) { paragraph("Sem dados para este grafico."); return; }
      const left = margin + 36;
      const right = W - margin - 10;
      const top = y + 8;
      const bottom = y + 165;
      const plotW = right - left;
      const plotH = bottom - top;
      const pointInset = 18;
      const dataLeft = left + pointInset;
      const dataRight = right - 10;
      const dataWidth = Math.max(1, dataRight - dataLeft);
      const xFor = i => graph.points.length === 1 ? dataLeft + dataWidth / 2 : dataLeft + i * dataWidth / (graph.points.length - 1);
      const yFor = value => top + (100 - value) * plotH / 100;
      [0, 25, 50, 75, 100].forEach(value => {
        const topY = yFor(value);
        line(left, topY, right, topY, .25);
        text(margin, topY + 3, 6.5, `${value}%`);
      });
      line(left, top, left, bottom, .7);
      line(left, bottom, right, bottom, .7);
      if (graph.points.length > 1) {
        page.push("0.18 0.42 0.33 RG 2 w");
        graph.points.forEach((point, index) => {
          const x = xFor(index);
          const yy = yFor(point.value);
          page.push(`${x.toFixed(2)} ${(H - yy).toFixed(2)} ${index ? "l" : "m"}`);
        });
        page.push("S 0 0 0 RG");
      }
      graph.points.forEach((point, index) => {
        const x = xFor(index);
        const yy = yFor(point.value);
        rect(x - 2, yy - 2, 4, 4, [.18, .42, .33], false);
        text(x - 8, Math.max(top + 6, yy - 7), 6.5, `${point.value}%`, true);
        text(x - 15, bottom + 13 + (index % 2) * 9, 6.2, pdfSafe(point.label).slice(0, 12));
      });
      y = bottom + 40;
    }
    function calendar(key) {
      const [year, monthNumber] = key.split("-").map(Number);
      const month = monthNumber - 1;
      const first = new Date(year, month, 1).getDay();
      const last = new Date(year, month + 1, 0).getDate();
      const rowsNeeded = Math.ceil((first + last) / 7);
      const cellW = (W - margin * 2) / 7;
      const cellH = 43;
      ensure(48 + (rowsNeeded + 1) * cellH);
      const stats = aggregateStats(entriesForMonth(key), "month");
      text(margin, y + 13, 12, formatMonthKey(key), true);
      text(margin + 280, y + 13, 8, `Total: ${stats.percentLabel} (${stats.done}/${stats.target})`);
      y += 23;
      WEEKDAY_NAMES.forEach((name, index) => {
        rect(margin + index * cellW, y, cellW, 18, [.90, .93, .94]);
        text(margin + index * cellW + 3, y + 12, 7, name, true);
      });
      y += 18;
      const byDate = new Map(uniqueEntriesByDate(entriesForMonth(key)).map(entry => [entry.date, entry]));
      const streakInfo = perfectStreaks();
      for (let slot = 0; slot < rowsNeeded * 7; slot++) {
        const day = slot - first + 1;
        const row = Math.floor(slot / 7);
        const col = slot % 7;
        const topCell = y + row * cellH;
        if (day < 1 || day > last) { rect(margin + col * cellW, topCell, cellW, cellH, [.98, .98, .98]); continue; }
        const iso = isoFromDate(new Date(year, month, day));
        const entry = byDate.get(iso);
        const fillMap = { none: [1, 1, 1], green: [.80, .94, .84], yellow: [.99, .94, .72], red: [.97, .82, .82] };
        const summaryForColor = entry ? daySummary(entry) : null;
        const color = !summaryForColor?.scheduled ? "none" : summaryForColor.percent >= 100 ? "green" : summaryForColor.percent > 50 ? "yellow" : "red";
        rect(margin + col * cellW, topCell, cellW, cellH, fillMap[color]);
        text(margin + col * cellW + 4, topCell + 12, 8, String(day), true);
        if (entry) {
          const summary = daySummary(entry);
          text(margin + col * cellW + 4, topCell + 25, 7, summary.future ? "-" : `${summary.percent}%`);
          text(margin + col * cellW + 4, topCell + 37, 6.2, pdfSafe(calendarSymbols(entry, streakInfo)).slice(0, 13));
        } else text(margin + col * cellW + 4, topCell + 29, 7, "-");
      }
      y += rowsNeeded * cellH + 14;
    }

    newPage();
    text(margin, 62, 23, "CheckList - Analise completa", true);
    text(margin, 83, 9, `Gerado em ${new Date().toLocaleString("pt-BR")}`);
    y = 108;
    const globalStreak = perfectStreaks();
    paragraph(`Streak atual de dias completos: ${globalStreak.current} dia(s). Maior streak all time: ${globalStreak.longest} dia(s). Estados justificados sao ignorados no percentual e nao interrompem streaks.`);

    heading("Analises semanais");
    state.weeks.forEach((week, index) => {
      const entries = entriesForWeek(week.id);
      const stats = aggregateStats(entries, "week");
      heading(`Semana ${index + 1} - ${formatDateShort(week.days[0].date)} a ${formatDateShort(week.days[6].date)}`, 12);
      paragraph(`FEITAS ${stats.done}/${stats.target} - Percentual ${stats.percentLabel} - Justificadas ${stats.excused}.`);
      table(["Atividade / categoria", "Feitas", "Streak", "Recorde", "%"], pdfRowsForPeriod(entries, "week"), [280, 62, 55, 58, 56]);
    });

    heading("Analises mensais");
    availableMonthKeys().forEach(key => {
      const entries = entriesForMonth(key);
      const stats = aggregateStats(entries, "month");
      heading(formatMonthKey(key), 12);
      paragraph(`FEITAS ${stats.done}/${stats.target} - Percentual ${stats.percentLabel} - Justificadas ${stats.excused}.`);
      table(["Atividade / categoria", "Feitas", "Streak", "Recorde", "%"], pdfRowsForPeriod(entries, "month"), [280, 62, 55, 58, 56]);
    });

    heading("Calendarios mensais");
    availableMonthKeys().forEach(calendar);

    heading("Graficos de todos os periodos");
    allGraphConfigs().forEach(config => chart(graphDataFor(config)));

    const objects = [];
    const pageIds = [];
    const contentIds = [];
    let nextId = 5;
    pages.forEach(() => { pageIds.push(nextId++); contentIds.push(nextId++); });
    objects[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objects[2] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(" ")}] /Count ${pages.length} >>`;
    objects[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>";
    objects[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>";
    pages.forEach((commands, index) => {
      const stream = commands.join("\n");
      objects[pageIds[index]] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentIds[index]} 0 R >>`;
      objects[contentIds[index]] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
    });
    let pdf = "%PDF-1.4\n% CheckList offline\n";
    const offsets = [0];
    for (let i = 1; i < objects.length; i++) {
      offsets[i] = pdf.length;
      pdf += `${i} 0 obj\n${objects[i]}\nendobj\n`;
    }
    const xref = pdf.length;
    pdf += `xref\n0 ${objects.length}\n0000000000 65535 f \n`;
    for (let i = 1; i < objects.length; i++) pdf += `${String(offsets[i]).padStart(10, "0")} 00000 n \n`;
    pdf += `trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return new Blob([pdf], { type: "application/pdf" });
  }

  function downloadAnalysisPDF() {
    try {
      const blob = createPDFDocument();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `analise_checklist_completa_${new Date().toISOString().slice(0, 10)}.pdf`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      setStatus("PDF completo criado com gráficos de todas as semanas, meses, anos e décadas.");
    } catch (error) {
      console.error(error);
      alert("Não foi possível gerar o PDF. Consulte o console do navegador.");
    }
  }

  load();
})();

</script>
